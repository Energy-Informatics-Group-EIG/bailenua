<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Baile Nua data viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --seq0:#f0efec; --seq1:#cde2fb; --seq2:#86b6ef; --seq3:#2a78d6; --seq4:#184f95; --seq5:#0d366b;
  --accent:#2a78d6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --seq0:#232321; --seq1:#104281; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#6da7ec; --seq5:#cde2fb;
    --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --seq0:#232321; --seq1:#104281; --seq2:#1c5cab; --seq3:#2a78d6; --seq4:#6da7ec; --seq5:#cde2fb;
  --accent:#3987e5;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:16px;margin:0 8px 2px}
.brand-sub{color:var(--muted);font-size:12px;margin:0 8px 16px}
nav button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;color:var(--ink-2);text-align:left;padding:8px;border-radius:8px;cursor:pointer}
nav button:hover{background:var(--surface-2)}
nav button.on{background:var(--surface-2);color:var(--ink);font-weight:600}
nav .count{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.side-foot{margin:20px 8px 0;font-size:12px;color:var(--muted);line-height:1.5}
main{padding:20px 24px 48px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.topbar h1{font-size:20px;margin:0 auto 0 0}
.btn,select,input[type=search]{color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.btn{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover,select:hover,input[type=search]:hover{border-color:var(--axis)}
input[type=search]{min-width:180px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink-2);background:var(--surface)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.pill.wait i{background:var(--warn);animation:pulse 1.6s infinite}
.pill.bad i{background:var(--crit);animation:none}
@keyframes pulse{50%{opacity:.35}}
.banner{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:14px;margin:0 0 2px}
.card .sub,p.sub{color:var(--muted);font-size:12px;margin:0 0 12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1100px){.c3,.c4,.c6,.c8{grid-column:span 6}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}
  .side-foot{display:none}
  nav{display:flex;flex-wrap:wrap;gap:4px}
  nav button{width:auto}
  main{padding:16px}
  .c3,.c4,.c6,.c8{grid-column:span 12}
}
.kpi .v{font-size:28px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink-2);font-size:12px}
.kpi .d{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
tr.on td{background:color-mix(in srgb, var(--accent) 12%, var(--surface))}
.tbl-wrap{max-height:520px;overflow:auto}
.name{word-break:break-word}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2);white-space:nowrap}
.view{display:none}.view.on{display:block}
.chart-box{width:100%;height:320px;overflow:hidden}
.figures{margin-bottom:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:baseline}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);opacity:0;z-index:50;max-width:280px}
svg text{fill:var(--muted);font-size:11px}
.axis path,.axis line{stroke:var(--axis)}
.gridl line{stroke:var(--grid)}.gridl path{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;color:var(--muted);font-size:12px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.crumbs button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.crumbs button:hover{text-decoration:underline}
.empty{padding:8px 4px 12px;color:var(--ink-2);max-width:70ch}
.empty h2{color:var(--ink);font-size:16px;margin:0 0 6px}
.empty p{margin:0 0 10px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font-size:12px;background:var(--surface-2);border-radius:8px;padding:4px 8px;color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600}
.mix{display:flex;flex-direction:column;gap:8px}
.mix .row{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;font-size:12px}
.mix .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mix .bar span{display:block;height:100%;background:var(--s1);border-radius:99px}
pre.raw{white-space:pre;word-break:normal;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0 0 12px;max-height:480px;overflow:auto}
.md h1{font-size:18px;margin:0 0 8px}
.md h2{font-size:16px;margin:0 0 8px}
.md h3{font-size:14px;margin:16px 0 6px}
.md p{margin:0 0 10px}
.md ul{margin:0 0 12px;padding-left:18px}
.md blockquote{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--s4);background:var(--surface-2);border-radius:0 8px 8px 0}
.md details{margin:0 0 12px}
.md summary{cursor:pointer;color:var(--ink-2);margin-bottom:8px}
.md a,a[data-open-id],a[data-cat]{color:var(--accent);text-decoration:none}
a[data-open-id]:hover,a[data-cat]:hover{text-decoration:underline}
#ds-info,#catDetail{scroll-margin-top:12px}
.md .tbl-wrap{max-height:none}
.cat-on{outline:2px solid var(--accent);outline-offset:1px}
.preview-img{max-width:100%;height:auto;border-radius:8px;background:var(--surface-2)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.stack{display:flex;flex-direction:column;gap:16px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Baile Nua</div>
    <div class="brand-sub" id="brandSub">Snapshot viewer</div>
    <nav id="nav">
      <button type="button" data-v="overview" class="on">Overview</button>
      <button type="button" data-v="catalogue">Catalogue <span class="count" id="nCat"></span></button>
      <button type="button" data-v="browse">Browse <span class="count" id="nFiles">–</span></button>
      <button type="button" data-v="homes">Homes</button>
      <button type="button" data-v="energy">Energy</button>
      <button type="button" data-v="population">Population</button>
      <button type="button" data-v="lifecourse">Life course</button>
      <button type="button" data-v="validation">Validation</button>
      <button type="button" data-v="datasets">Datasets</button>
    </nav>
    <div class="side-foot" id="sideMeta">Bucket: hrsd-occupants<br>Mode: snapshot</div>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="title">Overview</h1>
      <span class="pill" id="pill"><i></i><span id="pillText">Connecting…</span></span>
      <button type="button" class="btn" id="refresh">Refresh</button>
      <label class="btn" for="localFile">Open local file</label>
      <input id="localFile" type="file" hidden>
      <button type="button" class="btn" id="theme">Theme</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <section class="view on" id="v-overview"></section>
    <section class="view" id="v-catalogue"></section>
    <section class="view" id="v-browse"></section>
    <section class="view" id="v-homes"></section>
    <section class="view" id="v-energy"></section>
    <section class="view" id="v-population"></section>
    <section class="view" id="v-lifecourse"></section>
    <section class="view" id="v-validation"></section>
    <section class="view" id="v-datasets"></section>
  </main>
</div>
<div class="tip" id="tip"></div>
<script>
(function () {
const PER = 40;
const PER_FILES = 80;
const PREVIEW_BYTES = 2_000_000;
const PREVIEW_ROWS = 2000;
const TITLES = {overview:"Overview", catalogue:"Catalogue", browse:"Browse", homes:"Homes", energy:"Energy", population:"Population", lifecourse:"Life course", validation:"Validation", datasets:"Datasets"};
const PAGES = {
  homes: {blurb:"Geography, fabric, passport events, assets, and who lives in each home.", ids:["D01","D02","D03","D04","D06","D30"], open:"D02"},
  energy: {blurb:"Appliance cycles, indoor conditions, meter readings, exports, weather, tariffs, and the network.", ids:["D13","D15","D16","D17","D18","D19","D22","D27","D31"], open:"D18"},
  population: {blurb:"People, relationships, slowly changing states, where each person is, and the trial questionnaires.", ids:["D05","D07","D08","D11","D25","D26","D28","D29"], open:"D11"},
  lifecourse: {blurb:"Life events, activities, trips, shared calendar events, and change labels across 2022–2031.", ids:["D09","D10","D12","D14","D20","D21"], open:"D09"},
  validation: {blurb:"Versions, empirical targets, conventions, and where the design and the files disagree.", ids:["D23","D24","Appendix C","Appendix D"], open:"Appendix D"},
  browse: {blurb:"Layout of v1/ and the path recorded for every dataset.", ids:["Appendix A"], open:"Appendix A", table:"all"},
  datasets: {blurb:"Every dataset declared for this package.", ids:[], open:"D18", table:"all"}
};
const LENSES = {
  homes: {title:"Homes", hint:"homes, dwellings, or buildings", hints:[/home/i, /dwelling/i, /building/i]},
  energy: {title:"Energy", hint:"energy, electricity, demand, load, kWh, or flexus", hints:[/energy/i, /electric/i, /demand/i, /load/i, /kwh/i, /flexus/i, /\bder\b/i, /solar/i]},
  population: {title:"Population", hint:"population, residents, census, or occupants", hints:[/population/i, /resident/i, /census/i, /occupant/i]},
  lifecourse: {title:"Life course", hint:"events, life course, or passports", hints:[/event/i, /life[-_ ]?course/i, /passport/i]},
  validation: {title:"Validation", hint:"validation, gates, checks, or evidence", hints:[/valid/i, /gates?/i, /checks?/i, /evidence/i]}
};
const state = {
  connected:false, bucket:"hrsd-occupants", error:"", files:[], bytes:0, loadedAt:null,
  watching:false, timer:null, view:"overview", prefix:"", query:"", browsePage:0,
  browseSort:{key:"name", dir:1}, selected:"", tableQuery:"", page:0, sort:{key:"", dir:1},
  chart:{kind:"auto", x:"", y:""}, preview:null, manifest:null, lensFile:{},
  datasetQuery:"", datasetClass:"", previewSeq:0,
  cat:{query:"", cls:"", status:"", pkg:"", selected:"", doc:null, error:"", loading:false, promise:null},
  pagePick:{}, figures:{}
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("en-IE");
function fmtNum(n) {
  if (!Number.isFinite(n)) return "—";
  const abs = Math.abs(n);
  if (abs !== 0 && (abs >= 10000 || abs < 0.01)) return n.toExponential(2);
  return n.toLocaleString("en-IE", {maximumFractionDigits: abs >= 100 ? 0 : 2});
}
function fmtBytes(n) {
  if (n == null || !Number.isFinite(Number(n))) return "—";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let v = Number(n), i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? String(v) : v.toFixed(v < 10 ? 1 : 0)) + " " + units[i];
}
function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(Number(ms));
  if (Number.isNaN(d.getTime())) return "—";
  return d.toLocaleString("en-IE", {year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit"});
}
function extOf(name) {
  const base = String(name).split("/").pop();
  const i = base.lastIndexOf(".");
  return i <= 0 ? "" : base.slice(i + 1).toLowerCase();
}
function isTabularName(name) { return /^(csv|tsv|json|jsonl|ndjson|parquet)$/.test(extOf(name)); }
function isImage(name) { return /^(png|jpe?g|gif|webp|svg)$/.test(extOf(name)); }
function isParquet(name) { return extOf(name) === "parquet"; }
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function asNum(v) {
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  if (typeof v === "bigint") return Number(v);
  if (v == null || v === "") return null;
  const n = Number(String(v).replace(/,/g, "").trim());
  return Number.isFinite(n) ? n : null;
}
function asDate(v) {
  if (v instanceof Date && !Number.isNaN(v.getTime())) return v;
  const s = String(v ?? "").trim();
  if (!/^\d{4}-\d{2}-\d{2}/.test(s) && !/^\d{1,2}[/-]\d{1,2}[/-]\d{2,4}/.test(s)) return null;
  const t = Date.parse(s);
  return Number.isFinite(t) ? new Date(t) : null;
}
function cellStr(v) {
  if (v == null) return "";
  if (typeof v === "bigint") return v.toString();
  if (v instanceof Date) return v.toISOString();
  if (typeof v === "object") {
    try { return JSON.stringify(v); } catch { return String(v); }
  }
  return String(v);
}
function fmtCell(value, type) {
  if (value == null || value === "") return '<span style="color:var(--muted)">—</span>';
  if (type === "number") {
    const n = asNum(value);
    return n == null ? esc(value) : esc(fmtNum(n));
  }
  return esc(value);
}

async function api(path) {
  let res;
  try { res = await fetch(path, {cache:"no-store"}); }
  catch { throw new Error(offlineMessage()); }
  const text = await res.text();
  let body = {};
  try { body = text ? JSON.parse(text) : {}; }
  catch { body = {error: cleanError(text, res.status)}; }
  if (!res.ok) throw new Error(body.error || cleanError(text, res.status));
  return body;
}
function cleanError(text, status) {
  const raw = String(text || "");
  if (/<\s*html|<\s*body|404\s*-\s*not found/i.test(raw)) return "This host does not run the Backblaze proxy.";
  const plain = raw.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  return plain.slice(0, 180) || ("Request failed (" + status + ")");
}
function offlineMessage() {
  return "This host serves the catalogue as a file. It does not run Python, so the live Backblaze listing stays on the local viewer.";
}
function updatePill() {
  const pill = document.getElementById("pill");
  const text = document.getElementById("pillText");
  pill.classList.remove("wait", "bad");
  if (!state.connected) { pill.classList.add("wait"); text.textContent = state.cat.doc ? "v1 candidate" : "Loading catalogue"; return; }
  if (!state.files.length) {
    pill.classList.add("wait");
    text.textContent = state.watching ? "Waiting for snapshot" : "Bucket empty";
    return;
  }
  text.textContent = fmt(state.files.length) + " files · " + fmtBytes(state.bytes);
}
function updateSide() {
  const m = state.manifest || {};
  const bits = ["Bucket: " + esc(state.bucket), "Mode: snapshot"];
  if (m.release || m.version) bits.push("Release: " + esc(m.release || m.version));
  if (m.schema) bits.push("Schema " + esc(m.schema));
  document.getElementById("sideMeta").innerHTML = bits.join("<br>");
  document.getElementById("brandSub").textContent = m.title ? String(m.title) : "Snapshot viewer";
}
function updateBanner() {
  const el = document.getElementById("banner");
  if (state.connected && state.error) { el.hidden = false; el.textContent = state.error; }
  else el.hidden = true;
}
function updateCounts() {
  document.getElementById("nFiles").textContent = state.connected ? fmt(state.files.length) : "–";
}

function manifestCandidates() {
  return state.files.filter((f) => /(^|\/)(manifest|snapshot|catalog)\.json$/i.test(f.name))
    .sort((a, b) => a.name.split("/").length - b.name.split("/").length || a.name.length - b.name.length);
}
async function loadManifest() {
  const file = manifestCandidates()[0];
  if (!file || file.size > 1_000_000) { state.manifest = null; return; }
  try {
    const got = await fetchPreviewText(file.name, Math.max(file.size, 1));
    state.manifest = JSON.parse(got.text);
  } catch { state.manifest = null; }
}
async function refreshFiles(force) {
  const data = await api("/api/files" + (force ? "?refresh=1" : ""));
  state.files = data.files || [];
  state.bytes = data.bytes || 0;
  state.bucket = data.bucket || state.bucket;
  state.loadedAt = new Date();
  state.error = "";
  await loadManifest();
  updateCounts();
  updateSide();
  updatePill();
  updateBanner();
  paintCurrent();
}
function watch() {
  if (state.timer || state.files.length) { state.watching = false; updatePill(); return; }
  state.watching = true;
  updatePill();
  state.timer = setInterval(async () => {
    if (!state.connected || state.files.length) {
      clearInterval(state.timer);
      state.timer = null;
      state.watching = false;
      updatePill();
      return;
    }
    try { await refreshFiles(true); } catch (err) { state.error = err.message; updateBanner(); }
  }, 15000);
}
async function boot() {
  updatePill();
  const catalogueReady = loadCatalogue();
  try {
    const status = await api("/api/status");
    state.connected = true;
    state.bucket = status.bucket || state.bucket;
    await refreshFiles(true);
    watch();
  } catch (err) {
    state.connected = false;
    state.staticHost = true;
    state.error = "";
    updateCounts();
  }
  await catalogueReady;
  updatePill();
  paintCurrent();
}

function showView(view) {
  state.view = view;
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === view));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === "v-" + view));
  document.getElementById("title").textContent = TITLES[view] || view;
  paintCurrent();
}
function paintCurrent() {
  if (state.view === "overview") renderOverview();
  else if (state.view === "catalogue") enterCatalogue();
  else if (PAGES[state.view]) renderTopic(state.view);
  else if (state.view === "browse") { ensureBrowse(); paintBrowseList(); paintPreview(); }
  else if (state.view === "datasets") { ensureDatasets(); paintDatasetBody(); }
  else if (LENSES[state.view]) enterLens(state.view);
}
function filesForLens(id) {
  const spec = state.manifest && state.manifest.views && state.manifest.views[id];
  if (typeof spec === "string") return state.files.filter((f) => f.name === spec);
  return state.files.filter((f) => isTabularName(f.name) && LENSES[id].hints.some((re) => re.test(f.name)));
}

function headlineFigures(intro) {
  const chunk = (String(intro || "").split("### Headline figures")[1] || "").split(/\n### /)[0];
  const rows = [];
  chunk.split("\n").forEach((line) => {
    if (!/^\|/.test(line) || /^\|\s*\|/.test(line) || /\|\s*-{3,}/.test(line)) return;
    const cells = splitMdRow(line);
    if (cells[0]) rows.push({label:cells[0], value:cells[1] || "", from:(cells[2] || "").replace(/`/g, "")});
  });

  try { hy = await import("https://cdn.jsdelivr.net/npm/hyparquet/src/hyparquet.min.js"); }
  catch { throw new Error("Parquet preview needs the hyparquet library from the network. CSV and JSON still open."); }
  const source = file.blob
    ? {byteLength:file.blob.size, slice:(start, end) => file.blob.slice(start, end).arrayBuffer()}
    : await hy.asyncBufferFromUrl({url:"/api/file?name=" + encodeURIComponent(file.name)});
  const raw = await hy.parquetReadObjects({file:source, rowEnd:PREVIEW_ROWS});

  const seen = new Set();
  raw.slice(0, 50).forEach((row) => Object.keys(row).forEach((k) => { if (!seen.has(k)) { seen.add(k); keys.push(k); } }));
  const rows = raw.map((row) => {
    const obj = {};
    keys.forEach((k) => { obj[k] = cellStr(row[k]); });
    return obj;
  });
  const note = raw.length >= PREVIEW_ROWS ? "Showing the first " + fmt(PREVIEW_ROWS) + " rows." : "";
  return {kind:"table", columns:profile(keys, rows), rows, note};
}
async function buildPreview(file) {

    return {status:"ready", kind:"image", name, url, file, local:!!file.local};
  }
  if (isParquet(name)) {
    const table = await loadParquet(file);
    return {status:"ready", name, file, local:!!file.local, truncated:false, ...table};
  }
  if (/^(xlsx|xls|zip|gz|pdf|feather|arrow|orc)$/.test(extOf(name))) {

  }

  if (file.blob) {
    truncated = file.blob.size > PREVIEW_BYTES;
    text = await file.blob.slice(0, PREVIEW_BYTES).text();
    total = file.blob.size;

    const got = await fetchPreviewText(name, PREVIEW_BYTES);
    text = got.text; truncated = got.truncated; total = got.total || file.size;

  const dates = cols.filter((c) => c.type === "date");
  const cats = cols.filter((c) => c.type === "category" || c.type === "text");

function visibleRows(preview) {
  const q = state.tableQuery.trim().toLowerCase();
  let rows = preview.rows || [];
  if (q) rows = rows.filter((r) => (preview.columns || []).some((c) => String(r[c.name] ?? "").toLowerCase().includes(q)));
  if (state.sort.key) {
    const key = state.sort.key;
    const type = (preview.columns.find((c) => c.name === key) || {}).type;
    const dir = state.sort.dir;
    rows = rows.slice().sort((a, b) => {
      const va = type === "number" ? asNum(a[key]) : type === "date" ? (asDate(a[key]) || 0) : String(a[key] ?? "").toLowerCase();
      const vb = type === "number" ? asNum(b[key]) : type === "date" ? (asDate(b[key]) || 0) : String(b[key] ?? "").toLowerCase();
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      if (va > vb) return dir;
      if (va < vb) return -dir;

}
function resolveChart(preview) {
  const cols = preview.columns || [];
  if (!cols.length) return null;
  const byName = (name) => cols.some((c) => c.name === name);
  const nums = cols.filter((c) => c.type === "number");
  const dates = cols.filter((c) => c.type === "date");
  const cats = cols.filter((c) => c.type !== "number" && c.type !== "empty");
  const age = cols.find((c) => /age/i.test(c.name));
  const male = cols.find((c) => /^(male|males|men)$/i.test(c.name));
  const female = cols.find((c) => /^(female|females|women)$/i.test(c.name));
  let kind = state.chart.kind || "auto";
  let x = byName(state.chart.x) ? state.chart.x : "";
  let y = byName(state.chart.y) ? state.chart.y : (nums[0] || {}).name;
  if (kind === "auto") {
    if (age && male && female) return {kind:"pyramid", age:age.name, male:male.name, female:female.name};
    if (dates[0]) return {kind:"line", x:x || dates[0].name, y};
    if (cats[0] && y) return {kind:"bar", x:x || cats[0].name, y};
    if (y) return {kind:"hist", y};
    return null;

  if (kind === "pyramid" && age && male && female) return {kind, age:age.name, male:male.name, female:female.name};
  if (kind === "hist") return y ? {kind, y} : null;

}

function drawBars(node, rows, xKey, yKey) {

  const xs = d3.scaleBand().domain(data.map((d) => d.k)).range([m.l, width - m.r]).padding(0.28);

  svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(ys).ticks(5).tickFormat(d3.format("~s"))).call((g) => g.select(".domain").remove());

    .attr("x", (d) => xs(d.k)).attr("y", (d) => ys(d.v)).attr("width", xs.bandwidth()).attr("height", (d) => Math.max(0, ys(0) - ys(d.v)))

  const m = {t:12, r:16, b:36, l:52};
  const xs = dated
    ? d3.scaleTime().domain(d3.extent(shown, (d) => d.x)).range([m.l, width - m.r])

  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${height - m.b})`).call(dated ? d3.axisBottom(xs).ticks(6) : d3.axisBottom(xs).tickValues(shown.filter((_, i) => i % Math.ceil(shown.length / 6) === 0).map((d) => String(d.x))));

function drawHist(node, rows, yKey) {

  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${height - m.b})`).call(d3.axisBottom(xs).ticks(6).tickFormat(d3.format("~s")));

    let min = nums[0], max = nums[0];

function factCell(body, label) {
  const match = new RegExp("^\\|\\s*" + label + "\\s*\\|\\s*(.*?)\\s*\\|\\s*$", "m").exec(body);
  return match ? match[1].replace(/\*\*/g, "").trim() : "";
}
function anchorToId(href) {
  const h = String(href || "").replace(/^#/, "");
  const dataset = /^d(\d+)$/.exec(h);
  if (dataset) return "D" + dataset[1].padStart(2, "0");
  const appendix = /^appendix-([a-e])$/.exec(h);
  if (appendix) return "Appendix " + appendix[1].toUpperCase();
  return h;
}
function linkDatasetIds(html) {
  const known = new Set(((state.cat.doc && state.cat.doc.sections) || []).map((s) => s.id));
  let skip = 0;
  return String(html).split(/(<[^>]+>)/).map((part) => {
    if (part.startsWith("<")) {
      const tag = /^<\/?([a-z0-9]+)/i.exec(part);
      if (tag && tag[1].toLowerCase() === "a") skip += part.startsWith("</") ? -1 : (/\/>$/.test(part) ? 0 : 1);
      if (skip < 0) skip = 0;
      return part;
    }
    if (skip) return part;
    return part.replace(/(?<![A-Za-z0-9])D(\d{2})(?!\d)/g, (m, n) => {
      const id = "D" + n;
      if (!known.has(id)) return m;
      return `<a href="#${id.toLowerCase()}" data-open-id="${id}">${id}</a>`;
    });
  }).join("");
}
function renderInline(src) {
  return linkDatasetIds(esc(src)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((#[^)]+)\)/g, (_, label, href) => `<a href="${esc(href)}" data-cat="${esc(anchorToId(href))}">${label}</a>`));
}
function splitMdRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
}
function renderMdTable(lines) {
  const rows = lines.filter((line) => !/^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line.trim()));
  if (!rows.length) return "";
  const head = splitMdRow(rows[0]);
  const body = rows.slice(1).map(splitMdRow);
  return `<div class="tbl-wrap"><table><thead><tr>${head.map((cell) => `<th>${renderInline(cell)}</th>`).join("")}</tr></thead><tbody>${
    body.map((row) => `<tr>${head.map((_, i) => `<td>${renderInline(row[i] || "")}</td>`).join("")}</tr>`).join("")
  }</tbody></table></div>`;
}
function renderMarkdown(src) {
  const details = [];
  const text = String(src || "")
    .replace(/<div style="page-break-after: always;"><\/div>/g, "")
    .replace(/<a id="[^"]+"><\/a>/g, "")
    .replace(/<details><summary>([\s\S]*?)<\/summary>([\s\S]*?)<\/details>/g, (_, summary, inner) => {
      const n = details.length;
      details.push({summary, inner});
      return "\n\n@@DETAILS" + n + "@@\n\n";
    });
  const lines = text.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    const detail = /^@@DETAILS(\d+)@@$/.exec(line.trim());
    if (detail) {
      const block = details[Number(detail[1])];
      out.push(`<details open><summary>${renderInline(block.summary)}</summary>${renderMarkdown(block.inner)}</details>`);
      i++;
      continue;
    }
    if (line.startsWith("```")) {
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      if (i < lines.length) i++;
      out.push(`<pre class="raw">${esc(buf.join("\n"))}</pre>`);
      continue;
    }
    const heading = /^(#{1,4})\s+(.*)$/.exec(line);
    if (heading) {
      const level = heading[1].length;
      out.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
      i++;
      continue;
    }
    if (line.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${renderInline(buf.join(" "))}</blockquote>`);
      continue;
    }
    if (line.startsWith("|")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith("|")) buf.push(lines[i++]);
      out.push(renderMdTable(buf));
      continue;
    }
    if (/^[-*]\s/.test(line)) {
      const buf = [];
      while (i < lines.length && /^[-*]\s/.test(lines[i])) buf.push(lines[i++].replace(/^[-*]\s+/, ""));
      out.push(`<ul>${buf.map((item) => `<li>${renderInline(item)}</li>`).join("")}</ul>`);
      continue;
    }
    if (/^---+$/.test(line.trim())) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !lines[i].startsWith("|") && !lines[i].startsWith("```") && !lines[i].startsWith(">") && !/^#{1,4}\s/.test(lines[i]) && !/^[-*]\s/.test(lines[i]) && !/^@@DETAILS/.test(lines[i].trim()) && !/^---+$/.test(lines[i].trim())) {
      buf.push(lines[i++]);
    }
    out.push(`<p>${renderInline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}
function parseCatalogue(raw) {
  const md = raw.replace(/\r\n/g, "\n").replace(/<div style="page-break-after: always;"><\/div>/g, "").replace(/<a id="[^"]+"><\/a>/g, "");
  const contentsAt = md.search(/^## Contents/m);
  const intro = contentsAt < 0 ? md.trim() : md.slice(0, contentsAt).trim();
  const rest = contentsAt < 0 ? "" : md.slice(contentsAt);
  const sections = [];
  rest.split(/\n(?=## )/).forEach((chunk) => {
    const nl = chunk.indexOf("\n");
    const heading = (nl < 0 ? chunk : chunk.slice(0, nl)).replace(/^##\s+/, "").trim();
    const body = nl < 0 ? "" : chunk.slice(nl + 1).trim();
    if (!heading || heading === "Contents") return;
    const idMatch = /^(D\d{2}|Appendix [A-E])/.exec(heading);
    const id = idMatch ? idMatch[1] : heading;
    const title = heading.replace(/^(?:D\d{2}|Appendix [A-E])\s·\s/, "");
    const statusText = factCell(body, "Status");
    const status = (statusText.match(/^(present|partial|missing)/) || [""])[0];
    const classText = factCell(body, "Class");
    const cls = (classText.match(/^(GT|OBS|META)/) || [""])[0];
    sections.push({
      id, title, heading, body, cls, status, statusText,
      pkg: factCell(body, "Package"),
      rows: factCell(body, "Rows"),
      size: factCell(body, "Size"),
      path: factCell(body, "Path")
    });
  });
  return {intro, sections};
}

  const root = document.getElementById("v-catalogue");
  if (state.cat.error && !state.cat.doc) {
    root.dataset.ready = "";
    root.innerHTML = `<div class="card empty"><h2>Catalogue unavailable</h2><p>${esc(state.cat.error)}</p><p>Put <code>datasets.md</code> in the same folder as <code>data_viewer.html</code>.</p></div>`;
    return;
  }
  if (!state.cat.doc) return;
  if (!state.cat.selected) {
    const first = catDatasets().find((s) => s.id === "D18") || catDatasets().find((s) => s.status === "present");
    if (first) state.cat.selected = first.id;
  }
  if (!root.dataset.ready) {
    const packages = [...new Set(catDatasets().map((s) => s.pkg).filter(Boolean))];
    root.dataset.ready = "1";
    root.innerHTML = `
      <div id="catFigs"></div>
      <div id="catHead"></div>
      <div class="card" style="margin-top:16px">
        <div class="toolbar">
          <input type="search" class="cq" placeholder="Search" aria-label="Search the catalogue">
          <select class="ccls" aria-label="Class"><option value="">All classes</option><option>GT</option><option>OBS</option><option>META</option></select>
          <select class="cstat" aria-label="Status"><option value="">All statuses</option><option value="present">present</option><option value="partial">partial</option><option value="missing">missing</option></select>
          <select class="cpkg" aria-label="Package"><option value="">All packages</option>${packages.map((p) => `<option>${esc(p)}</option>`).join("")}</select>
        </div>
        <p class="sub" id="catCount"></p>
        <div class="tbl-wrap"><table class="cat-tbl"></table></div>
        <p class="sub" style="margin-top:12px">Appendices</p>
        <div class="checks" id="catApps"></div>
      </div>
      <div id="catDetail" style="margin-top:16px"></div>`;
    document.getElementById("catHead").innerHTML = `<div class="card md cat-intro">${renderMarkdown(state.cat.doc.intro)}</div>`;
  }
  paintCatTable();
  paintCatDetail();
  paintCatFigures();
}
function paintCatTable() {
  const tbl = document.querySelector("#v-catalogue .cat-tbl");
  if (!tbl || !state.cat.doc) return;
  const rows = catVisible();
  const all = catDatasets();
  const tally = (status) => all.filter((s) => s.status === status).length;
  document.getElementById("catCount").textContent = fmt(rows.length) + " shown · " + fmt(all.length) + " declared · " + tally("present") + " present · " + tally("partial") + " partial · " + tally("missing") + " missing";
  tbl.innerHTML = `<thead><tr><th>Dataset</th><th>Title</th><th>Class</th><th>Package</th><th>Status</th><th class="num">Rows</th><th class="num">Size</th></tr></thead><tbody>${
    rows.map((s) => `<tr class="${s.id === state.cat.selected ? "on" : ""}" data-cat="${esc(s.id)}" style="cursor:pointer"><td><a href="#${esc(s.id.toLowerCase())}" data-open-id="${esc(s.id)}"><b>${esc(s.id)}</b></a></td><td class="name">${esc(s.title)}</td><td>${s.cls ? `<span class="badge">${esc(s.cls)}</span>` : ""}</td><td>${esc(s.pkg)}</td><td>${statusBadge(s.status)}</td><td class="num">${esc(s.rows || "—")}</td><td class="num">${esc(s.size || "—")}</td></tr>`).join("")
    || `<tr><td colspan="7" style="color:var(--muted)">No dataset matches.</td></tr>`
  }</tbody>`;
  const q = state.cat.query.trim().toLowerCase();
  document.getElementById("catApps").innerHTML = catAppendices().filter((s) => !q || (s.id + " " + s.title + " " + s.body).toLowerCase().includes(q)).map((s) => `<button type="button" class="btn${s.id === state.cat.selected ? " cat-on" : ""}" data-cat="${esc(s.id)}">${esc(s.id)}</button>`).join("");
}
function paintCatDetail() {
  const host = document.getElementById("catDetail");
  if (!host || !state.cat.doc) return;
  const section = state.cat.doc.sections.find((s) => s.id === state.cat.selected);
  if (!section) {
    host.innerHTML = '<div class="card empty"><h2>Select a dataset</h2><p>Each row opens the full catalogue entry: description, facts, schema, sample, joins and validation. The appendices cover the folder tree, keys, conventions, design against disk, and the glossary.</p></div>';
    return;
  }
  host.innerHTML = `<div class="card md"><h2><a href="#${esc(section.id.toLowerCase())}" data-open-id="${esc(section.id)}">${esc(section.id)}</a> · ${esc(section.title)}</h2>${section.pkg || section.status ? `<p class="sub">${linkDatasetIds(esc([section.cls, section.pkg, section.statusText].filter(Boolean).join(" · ")))}</p>` : ""}<div>${renderMarkdown(section.body)}</div></div>`;
}

window.__viewer = {
  state,
  previewCsv(name, text) {
    showView("browse");
    state.selected = name;
    const parsed = parsePayload(name, text);
    state.preview = {status:"ready", name, local:true, file:{name, size:text.length}, ...parsed};
    state.chart = suggestChart(state.preview);
    paintPreview();
  }
};
boot();
})();
</script>
</body>
</html>
