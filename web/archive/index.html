<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isSmall = window.innerWidth < 760;

/* ---------- seeded randomness: the same town every load ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R = mulberry32(20261001);
const rand = (a,b)=>a+(b-a)*R();
const pick = a=>a[Math.floor(R()*a.length)];
const smooth = (a,b,v)=>{let t=(v-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const hash2 = (a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);};

/* ---------- terrain: an irregular harbour to the south, a creek, an island, hills to the north ---------- */
const SHORE=[[-1500,370],[-1200,340],[-950,302],[-760,302],[-600,272],[-460,282],[-330,306],[-220,300],[-140,280],[-60,264],[10,256],[80,266],[150,288],[230,302],[320,312],[420,346],[500,392],[580,412],[660,382],[740,322],[840,272],[980,258],[1150,282],[1500,312]];
function shoreZ(x){
  if(x<=SHORE[0][0])return SHORE[0][1];
  for(let i=1;i<SHORE.length;i++){
    if(x<=SHORE[i][0]){
      const p0=SHORE[Math.max(0,i-2)][1],p1=SHORE[i-1][1],p2=SHORE[i][1],p3=SHORE[Math.min(SHORE.length-1,i+1)][1];
      const t=(x-SHORE[i-1][0])/(SHORE[i][0]-SHORE[i-1][0]),t2=t*t,t3=t2*t;
      return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3)+4*Math.sin(x/37)+2.5*Math.sin(x/13+1);
    }
  }
  return SHORE[SHORE.length-1][1];
}
const CREEK=[[182,310],[176,240],[190,165],[226,102],[272,58]];
function creek(x,z){
  let best=1e9,bt=0,acc=0,total=0;
  const segs=[];for(let i=1;i<CREEK.length;i++){const l=Math.hypot(CREEK[i][0]-CREEK[i-1][0],CREEK[i][1]-CREEK[i-1][1]);segs.push(l);total+=l;}
  for(let i=1;i<CREEK.length;i++){
    const [ax,az]=CREEK[i-1],[bx,bz]=CREEK[i];const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz;
    let t=((x-ax)*dx+(z-az)*dz)/l2;t=t<0?0:t>1?1:t;
    const d=Math.hypot(x-ax-dx*t,z-az-dz*t);
    if(d<best){best=d;bt=(acc+t*segs[i-1])/total;}
    acc+=segs[i-1];
  }
  return {d:best,hw:30-22*bt};
}
const PADS=[];
function baseH(x,z){
  const sz=shoreZ(x);
  let h=2.6+Math.max(0,sz-z)*0.032;
  h+=16*Math.exp(-((x+60)*(x+60))/(320*320)-((z-40)*(z-40))/(200*200));        // the hill the old town climbs
  h+=10*Math.exp(-((x-470)*(x-470))/(160*160)-((z-260)*(z-260))/(110*110));      // headland across the bay
  const n=smooth(-300,-850,z);
  h+=n*(95+30*Math.sin(x/230+0.6)+14*Math.sin(x/97+2.1)+8*Math.cos(z/120));
  h+=smooth(820,1200,Math.abs(x))*55*(0.8+0.2*Math.sin(z/150));

  if(z>sz)h=Math.min(h,2.6-(z-sz)*0.3);

  if(c.d<c.hw+26){const k=1-smooth(c.hw-6,c.hw+24,c.d);h=h*(1-k)-2.6*k;}
  const ex=(x-180)/95,ez=(z-505)/55,e=ex*ex+ez*ez;               // the island
  if(e<1.5)h=Math.max(h,e<1?3+20*(1-e):3-(e-1)*24);
  return h;
}
function H(x,z){
  let h=baseH(x,z);
  for(const p of PADS){
    const dx=Math.max(p.x0-x,0,x-p.x1),dz=Math.max(p.z0-z,0,z-p.z1);
    const d=Math.hypot(dx,dz);

const PAD={
  schools:pad(-500,-240,-175,15),
  commercial:pad(235,405,-190,-110),
  enterprise:pad(620,840,-262,-112),
  substation:pad(482,558,-285,-215),
  water:pad(-785,-695,170,224),
  site:pad(-550,-390,-380,-280),

/* ---------- renderer, scene, camera ---------- */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});

controls.minDistance=25;controls.maxDistance=3400;controls.screenSpacePanning=false;

/* ---------- materials ---------- */
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.9,metalness:0},o));

  roof:std('#ffffff',{flatShading:true}),
  leaf:std('#ffffff',{flatShading:true}),
  conifer:std('#ffffff',{flatShading:true}),
  wood:std('#6b5a45'),
  pv:std('#1d2f4f',{roughness:0.35,metalness:0.25}),
  lamp:new THREE.MeshStandardMaterial({color:'#3a3a38',emissive:'#ffc77a',emissiveIntensity:0}),
  wire:new THREE.LineBasicMaterial({color:'#2b2b2b',transparent:true,opacity:0.75}),
  win:new THREE.MeshBasicMaterial({color:'#3d4651'}),
  red:new THREE.MeshBasicMaterial({color:'#401010'}),
  bulbs:new THREE.MeshBasicMaterial({color:'#ffffff'}),

const roadMat=c=>std(c,{polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});

/* ---------- collections ---------- */
const boxes=[],roofs=[],windows=[],pvs=[],hpUnits=[],chargers=[],cars=[];
const broadleaf=[],conifers=[],poles=[],arms=[],lampPosts=[],kiosks=[],poleTx=[],pins=[],discs=[];
const wirePts=[],servicePts=[],GREENS=[];
const count={detached:0,semi:0,terrace:0,centre:0,apartment:0,rural:0,pv:0,hp:0,ev:0,publicEv:0,solarPanels:0,turbines:0,poles:0,txPole:0,txGround:0};

/* reserved areas (oriented rectangles) and an occupancy hash so nothing overlaps */
const ZR=[];
function zoneRect(cx,cz,hw,hd,rot=0){ZR.push({cx,cz,hw,hd,c:Math.cos(rot),s:Math.sin(rot)});}
function inZone(x,z,m=0){for(const q of ZR){const dx=x-q.cx,dz=z-q.cz;const u=dx*q.c-dz*q.s,v=dx*q.s+dz*q.c;if(Math.abs(u)<q.hw+m&&Math.abs(v)<q.hd+m)return true;}return false;}
const OCC=new Map();let ROW=0;
function occAdd(x,z,r,row=0){const k=Math.floor(x/16)+','+Math.floor(z/16);let a=OCC.get(k);if(!a){a=[];OCC.set(k,a);}a.push(x,z,r,row);}
function occScan(x,z,r,fn){const cx=Math.floor(x/16),cz=Math.floor(z/16),sp=Math.ceil((r+24)/16);for(let i=-sp;i<=sp;i++)for(let j=-sp;j<=sp;j++){const a=OCC.get((cx+i)+','+(cz+j));if(!a)continue;for(let k=0;k<a.length;k+=4)if(fn(a[k],a[k+1],a[k+2],a[k+3]))return true;}return false;}
const occHit=(x,z,r,row)=>occScan(x,z,r,(ox,oz,or,orow)=>!(row!==0&&orow===row)&&Math.hypot(ox-x,oz-z)<or+r);
const occNear=(x,z,d)=>occScan(x,z,d,(ox,oz,or)=>Math.hypot(ox-x,oz-z)<or+d);

/* ---------- roads ---------- */
const roadCells=new Map(),roads={};
function regRoad(x,z,w){const k=Math.floor(x/20)+','+Math.floor(z/20);let a=roadCells.get(k);if(!a){a=[];roadCells.set(k,a);}a.push(x,z,w);}
function nearRoad(x,z,m){const cx=Math.floor(x/20),cz=Math.floor(z/20);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=roadCells.get((cx+i)+','+(cz+j));if(!a)continue;for(let k=0;k<a.length;k+=3)if(Math.hypot(a[k]-x,a[k+1]-z)<a[k+2]/2+m)return true;}return false;}
function ribbon(sp,width,lift,dash,offset=0){
  const v=[],idx=[];const n=sp.length-1;
  for(let i=0;i<=n;i++){
    const p=sp[i],a=sp[Math.max(0,i-1)],b=sp[Math.min(n,i+1)];
    let tx=b.x-a.x,tz=b.z-a.z;const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
    const px=tz,pz=-tx,cx=p.x+px*offset,cz=p.z+pz*offset;
    const lx=cx+px*width/2,lz=cz+pz*width/2,rx=cx-px*width/2,rz=cz-pz*width/2;
    const y=(p.y!==undefined?p.y:Math.max(H(cx,cz),H(lx,lz),H(rx,rz)))+lift;
    v.push(lx,y,lz,rx,y,rz);
    if(i<n&&(!dash||Math.floor(i/2)%2===0)){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();return g;
}
let RID=0;
function addRoad(name,pts,width,kind='main',centre=false,closed=false){
  name=name||('r'+(RID++));
  const curve=new THREE.CatmullRomCurve3(pts.map(([x,z])=>new THREE.Vector3(x,0,z)),closed,'centripetal');
  const len=curve.getLength(),n=Math.max(2,Math.ceil(len/4));const sp=curve.getSpacedPoints(n);
  const cum=[0];for(let i=1;i<sp.length;i++)cum.push(cum[i-1]+Math.hypot(sp[i].x-sp[i-1].x,sp[i].z-sp[i-1].z));
  const bridgeM=std('#9b958a');
  sp.forEach((p,i)=>{
    let y=Math.max(H(p.x,p.z),H(p.x+width/2,p.z),H(p.x-width/2,p.z),H(p.x,p.z+width/2),H(p.x,p.z-width/2));
    if(y<3.3){y=3.3;
      if(H(p.x,p.z)<1&&i%2===0){const a=sp[Math.max(0,i-1)],b=sp[Math.min(sp.length-1,i+1)];const rot=Math.atan2(-(b.z-a.z),b.x-a.x);
        boxes.push({x:p.x,z:p.z,y:-3,w:4.2,d:width+1.2,h:6.25,rot,color:'#9b958a'});
        for(const s of [-1,1]){const tx=(b.x-a.x),tz=(b.z-a.z),l=Math.hypot(tx,tz)||1;boxes.push({x:p.x+(tz/l)*s*(width/2+0.4),z:p.z-(tx/l)*s*(width/2+0.4),y:3.3,w:4.2,d:0.5,h:1.1,rot,color:'#a8a296'});}}}
    p.y=y;regRoad(p.x,p.z,width);
  });
  const m=new THREE.Mesh(ribbon(sp,width,0.3,false),roadMats[kind]);m.receiveShadow=true;scene.add(m);
  if(centre)scene.add(new THREE.Mesh(ribbon(sp,0.25,0.34,true),roadMats.line));
  const path={name,sp,cum,len:cum[cum.length-1],width,curve,kind};roads[name]=path;return path;
}
function pathAt(P,s){const {sp,cum}=P;s=Math.max(0,Math.min(P.len-0.001,s));let lo=0,hi=cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(cum[m]<=s)lo=m;else hi=m;}
  const a=sp[lo],b=sp[hi];const t=(s-cum[lo])/((cum[hi]-cum[lo])||1);let tx=b.x-a.x,tz=b.z-a.z;const l=Math.hypot(tx,tz)||1;return {x:a.x+(b.x-a.x)*t,z:a.z+(b.z-a.z)*t,tx:tx/l,tz:tz/l};}
function disc(x,z,r){discs.push({x,z,r,y:H(x,z)});for(let a=0;a<6.28;a+=0.8)regRoad(x+Math.cos(a)*r*0.5,z+Math.sin(a)*r*0.5,r);regRoad(x,z,r*2);}
function streetLights(P,offset,every){for(let s=every/2;s<P.len;s+=every){const m=pathAt(P,s);const x=m.x+m.tz*offset,z=m.z-m.tx*offset;lampPosts.push({x,z,y:H(x,z),rot:Math.atan2(-m.tz,m.tx)+Math.PI/2});}}
const MAIN=['coast','quay','main','fisher','barrack','church','pearse','headland','bypass'];
function nearestMain(x,z){let best=null,bd=1e9;for(const n of MAIN){const P=roads[n];if(!P)continue;for(let i=0;i<P.sp.length;i+=2){const p=P.sp[i];const d=Math.hypot(p.x-x,p.z-z);if(d<bd){bd=d;best=p;}}}return {p:best,d:bd};}
function connect(x,z,width=6.5){const {p,d}=nearestMain(x,z);if(!p||d<5)return null;return addRoad(null,[[x,z],[(x+p.x)/2+rand(-4,4),(z+p.z)/2+rand(-4,4)],[p.x,p.z]],width,'estate');}

/* ---------- houses and buildings ---------- */
const PASTEL=['#e9a3a8','#f1cf6a','#8fb6d6','#a7cf9a','#c94a40','#f2eee4','#5f90b0','#e9b073','#b9a3d1','#2f6b5a','#f0e2b6','#d8e6e4','#7a2232','#28465a','#f4f1ea','#e4c27a'];
const ESTATE=['#efe8d8','#e7ddc6','#f4f1ea','#dad5c9','#efe1ba','#e9d3c2','#dfe4e1','#e5e0d3','#d8cdb8','#cfc6b6'];
const NEWBUILD=['#e9e6df','#d6d2c8','#bfc3c4','#ece4d4','#c9b9a3'];
const ROOFS=['#4a4f56','#555a61','#5a5048','#3f444a','#615549'];
const CARCOL=['#e6e6e6','#1c1c1e','#8a8f96','#b31f24','#1f3f73','#c9c9c9','#2f5d3a','#6e7378','#f2f2f2','#3c4046'];
const carColour=()=>pick(CARCOL);
function L(o,lx,lz){const c=Math.cos(o.rot||0),s=Math.sin(o.rot||0);return [o.x+lx*c+lz*s,o.z-lx*s+lz*c];}
function addHouse(o){
  o.rot=o.rot||0;o.front=o.front||1;
  const {w,d,storeys}=o;
  const g=[L(o,-w/2,-d/2),L(o,w/2,-d/2),L(o,w/2,d/2),L(o,-w/2,d/2)].map(([a,b])=>H(a,b));
  const gmin=Math.min(...g),gmax=Math.max(...g);
  const floorY=gmax+0.25,top=floorY+storeys*2.9;
  boxes.push({x:o.x,z:o.z,y:gmin-1.4,w,d,h:top-(gmin-1.4),rot:o.rot,color:o.color});
  if(o.shell)return top;
  const rh=o.flat?0:(o.rh||Math.min(d*0.36,4.4));
  if(o.flat)boxes.push({x:o.x,z:o.z,y:top,w:w+0.3,d:d+0.3,h:0.45,rot:o.rot,color:'#77797b'});
  else roofs.push({x:o.x,z:o.z,y:top,w:w+0.5,d:d+0.8,h:rh,rot:o.rot,color:o.roof||pick(ROOFS)});
  if(o.chimney&&!o.flat){const [cx,cz]=L(o,w/2-0.9,0);boxes.push({x:cx,z:cz,y:top,w:0.9,d:0.7,h:rh+1.1,rot:o.rot,color:'#8b8178'});}
  const nw=Math.max(1,Math.round(w/(o.big?4.2:3.4)));
  for(let s=0;s<storeys;s++)for(const f of [1,-1])for(let k=0;k<nw;k++){
    if(o.shop&&s===0&&f===o.front)continue;
    const [wx,wz]=L(o,-w/2+(k+0.5)*w/nw,f*(d/2+0.05));
    windows.push({x:wx,z:wz,y:floorY+s*2.9+1.55,w:Math.min(1.35,w/nw*0.55),h:1.15,rot:o.rot,c:R()<(o.litP||0.5)?'#ffcf86':'#2b333d'});
  }
  if(o.shop){const [sx,sz]=L(o,0,o.front*(d/2+0.06));windows.push({x:sx,z:sz,y:floorY+1.3,w:w*0.74,h:2.1,rot:o.rot,c:R()<0.8?'#ffe3ad':'#3a4048'});}
  if(o.pv&&!o.flat){const half=(d+0.8)/2,th=Math.atan(rh/half),sl=Math.hypot(rh,half);
    const side=R()<0.5?1:-1; // whichever slope gets the sun
    const [px,pz]=L(o,0,side*half/2);pvs.push({x:px,z:pz,y:top+rh/2+0.12,w:w*0.72,d:sl*0.72,th:th*side,rot:o.rot});
    count.pv++;pins.push({x:o.x,z:o.z,y:top+rh+5,c:'pv'});}
  if(o.hp){const [hx,hz]=L(o,w/4,-o.front*(d/2+0.7));hpUnits.push({x:hx,z:hz,y:H(hx,hz),rot:o.rot});count.hp++;pins.push({x:o.x+1.6,z:o.z,y:top+rh+7,c:'hp'});}
  if(o.ev){const [ex,ez]=L(o,w/2-0.7,o.front*(d/2+0.15));chargers.push({x:ex,z:ez,y:floorY+0.9,rot:o.rot,wall:true});count.ev++;pins.push({x:o.x-1.6,z:o.z,y:top+rh+9,c:'ev'});}
  if(o.car){const side=R()<0.5?-1:1;const [cx,cz]=L(o,side*(w/2-1.5),o.front*(d/2+Math.min(4.4,(o.setback||6)-1.6)));if(!nearRoad(cx,cz,0.5))cars.push({x:cx,z:cz,y:H(cx,cz)+0.05,rot:o.rot,color:carColour()});}
  if(o.kind)count[o.kind]+=o.units||1;
  return top+rh;
}
const UNIT={
  centre:()=>({n:1,w:rand(6.2,10),d:12,gap:0.05,setback:0.8,storeys:R()<0.6?2:R()<0.86?3:4}),
  semi:()=>({n:2,w:7.4,d:9,gap:rand(4,6.5),setback:6,storeys:2}),
  terrace:()=>({n:4+Math.floor(R()*3),w:6,d:9.5,gap:rand(3.5,5.5),setback:4.5,storeys:2}),
  detached:()=>({n:1,w:rand(10,13),d:rand(9,11),gap:rand(8,13),setback:rand(8,11),storeys:2}),
  bungalow:()=>({n:1,w:rand(12,15),d:rand(8.5,10),gap:rand(9,14),setback:rand(8,12),storeys:1}),
};
const KIND={centre:'centre',semi:'semi',terrace:'terrace',detached:'detached',bungalow:'detached'};
function assets(o={}){return {pv:R()<(o.pv??0.06),hp:R()<(o.hp??0.03),ev:R()<(o.ev??0.05),car:R()<(o.car??0.7)};}
function siteOK(cx,cz,r,row,tx,tz,zx,zz,w,d,J){
  if(J.filter&&!J.filter(cx,cz))return false;
  if(inZone(cx,cz,r*0.55))return false;
  if(occHit(cx,cz,r,row))return false;
  for(const [a,b] of [[1,1],[1,-1],[-1,1],[-1,-1]]){const x=cx+tx*a*w/2+zx*b*d/2,z=cz+tz*a*w/2+zz*b*d/2;if(H(x,z)<2.3||nearRoad(x,z,0.4))return false;}
  if(H(cx,cz)<2.3||nearRoad(cx,cz,d/2-1.2))return false;
  return true;
}
function housesAlong(J){
  const P=J.path;
  for(const side of (J.sides||[-1,1])){
    const row=++ROW;let s=(J.s0||0)+rand(1,5);const s1=Math.min(P.len,J.s1??P.len)-3;
    while(s<s1){
      const type=Array.isArray(J.type)?pick(J.type):J.type;const U=UNIT[type]();const total=U.n*U.w;
      if(s+total>s1)break;
      const m=pathAt(P,s+total/2);const rot=Math.atan2(-m.tz,m.tx);
      const zx=-m.tz,zz=m.tx,lx=m.tz,lz=-m.tx;
      const off=P.width/2+U.setback+U.d/2;const cx=m.x+lx*side*off,cz=m.z+lz*side*off;
      const r=0.5*Math.hypot(total,U.d)*0.9;
      if(siteOK(cx,cz,r,row,m.tx,m.tz,zx,zz,total,U.d,J)){
        const col=pick(J.palette||ESTATE),roof=pick(ROOFS);
        for(let k=0;k<U.n;k++){const o2=-total/2+U.w*(k+0.5);
          addHouse(Object.assign({x:cx+m.tx*o2,z:cz+m.tz*o2,w:U.w,d:U.d,storeys:U.storeys,rot,front:side,setback:U.setback,
            color:type==='centre'?pick(PASTEL):(type==='terrace'&&R()<0.25?pick(J.palette||ESTATE):col),roof,kind:J.kind||KIND[type],
            shop:type==='centre'&&R()<(J.shops??0.65),chimney:!(J.opt&&J.opt.nzeb)&&R()<0.6,litP:type==='centre'?0.6:0.5},assets(J.opt)));
        }
        occAdd(cx,cz,r,row);
        if(type!=='centre'&&R()<0.45){const bx=cx-zx*side*(U.d/2+rand(5,9))+m.tx*rand(-total/3,total/3),bz=cz-zz*side*(U.d/2+rand(5,9))+m.tz*rand(-total/3,total/3);
          if(!nearRoad(bx,bz,3)&&H(bx,bz)>2.5&&!inZone(bx,bz,0))broadleaf.push({x:bx,z:bz,y:H(bx,bz),s:rand(2.2,3.8),c:pick(['#4b7a34','#5a8a3c','#628f43','#3f6b2e'])});}
      }
      s+=total+U.gap;
    }
  }
}
function placeSpecial(tx,tz,w,d,rot,make,reach=90){
  for(let rr=0;rr<=reach;rr+=6)for(let a=0;a<6.28;a+=rr?6/rr:7){
    const x=tx+Math.cos(a)*rr,z=tz+Math.sin(a)*rr;const r=0.5*Math.hypot(w,d)+1;
    const c=Math.cos(rot),s=Math.sin(rot);
    let ok=!inZone(x,z,r*0.6)&&!occHit(x,z,r,0)&&!nearRoad(x,z,Math.min(w,d)/2+1.5);
    if(ok)for(const [p,q] of [[1,1],[1,-1],[-1,1],[-1,-1]]){const px=x+p*w/2*c+q*d/2*s,pz=z-p*w/2*s+q*d/2*c;if(H(px,pz)<2.4||nearRoad(px,pz,1)){ok=false;break;}}
    if(ok){occAdd(x,z,r,0);make(x,z);return [x,z];}
  }
  return null;
}

/* ---------- estate typologies ---------- */
const JOBS=[],ESTATES={};
const local=(cx,cz,rot)=>{const c=Math.cos(rot),s=Math.sin(rot);return (u,v)=>[cx+u*c+v*s,cz-u*s+v*c];};
function kioskAt(x,z){const g=H(x,z);boxes.push({x,z,y:g-0.3,w:3.2,d:2.2,h:2.5,rot:0,color:'#5d7360'});kiosks.push({x,z,type:'ground'});count.txGround++;occAdd(x,z,2.5,0);}
function entry(name,pts){let best=null,bd=1e9;for(const p of pts){const {d}=nearestMain(p[0],p[1]);if(d<bd){bd=d;best=p;}}const r=connect(best[0],best[1]);if(r){const m=pathAt(r,Math.min(10,r.len/2));kioskAt(m.x+m.tz*7,m.z-m.tx*7);}return best;}
function trees(list,n,pts,s=[2.5,4]){for(let i=0;i<n;i++){const [x,z]=pick(pts);list.push({x:x+rand(-2,2),z:z+rand(-2,2),y:H(x,z),s:rand(...s),c:pick(['#4b7a34','#5a8a3c','#628f43','#3f6b2e'])});}}
function rowsEstate(name,cx,cz,rot,len,n,spacing,types,opt,pal){
  const T=local(cx,cz,rot);
  for(let k=0;k<n;k++){const v=(k-(n-1)/2)*spacing,bow=rand(-9,9);
    const p=addRoad(name+'r'+k,[T(-len/2,v),T(0,v+bow),T(len/2,v)],6.5,'estate');streetLights(p,4.2,42);
    JOBS.push({path:p,type:types[k%types.length],opt,palette:pal,s0:6,s1:p.len-6});disc(...T(-len/2,v),7);}
  const sp=addRoad(name+'sp',[T(len/2+4,-(n-1)/2*spacing-6),T(len/2+4,(n-1)/2*spacing+6)],6.5,'estate');
  JOBS.push({path:sp,type:types[0],opt,palette:pal,s0:10,s1:sp.len-10});
  entry(name,[T(len/2+4,-(n-1)/2*spacing-6),T(len/2+4,(n-1)/2*spacing+6)]);
  ESTATES[name]={x:cx,z:cz};
}
function greenEstate(name,cx,cz,rot,gw,gd,types,opt,pal){
  const T=local(cx,cz,rot);const hw=gw/2+6,hd=gd/2+6;
  const pts=[T(hw,0),T(hw,hd*0.7),T(hw*0.72,hd),T(0,hd),T(-hw*0.72,hd),T(-hw,hd*0.7),T(-hw,0),T(-hw,-hd*0.7),T(-hw*0.72,-hd),T(0,-hd),T(hw*0.72,-hd),T(hw,-hd*0.7)];
  const loop=addRoad(name+'loop',pts,6.5,'estate',false,true);streetLights(loop,4.2,40);
  zoneRect(cx,cz,gw/2,gd/2,rot);GREENS.push({type:'rect',cx,cz,hw:gw/2,hd:gd/2,c:Math.cos(rot),s:Math.sin(rot)});
  const edge=[];for(let u=-gw/2+3;u<=gw/2-3;u+=7){edge.push(T(u,gd/2-3),T(u,-gd/2+3));}for(let v=-gd/2+3;v<=gd/2-3;v+=7){edge.push(T(gw/2-3,v),T(-gw/2+3,v));}
  trees(broadleaf,Math.round(edge.length*0.45),edge,[2.6,4.4]);
  JOBS.push({path:loop,type:types,opt,palette:pal});
  const out=[T(hw,0),T(-hw,0),T(0,hd),T(0,-hd)];
  for(const k of [0,1]){const [sx,sz]=out[k];const dir=k===0?1:-1;const e=T(dir*(hw+rand(55,85)),rand(-12,12));
    const p=addRoad(null,[[sx,sz],[(sx+e[0])/2+rand(-6,6),(sz+e[1])/2+rand(-6,6)],e],6.5,'estate');disc(e[0],e[1],7.5);JOBS.push({path:p,type:types,opt,palette:pal,s0:6});}
  entry(name,out);ESTATES[name]={x:cx,z:cz};
}
function crescentEstate(name,cx,cz,R0,a0,a1,types,opt,pal){
  const pts=[];for(let k=0;k<=10;k++){const a=a0+(a1-a0)*k/10;pts.push([cx+Math.cos(a)*R0,cz+Math.sin(a)*R0]);}
  const p=addRoad(name,pts,6.5,'estate');streetLights(p,4.2,40);JOBS.push({path:p,type:types,opt,palette:pal,s0:6,s1:p.len-6});
  const gr=R0*0.42;zoneRect(cx,cz+R0*0.25,gr,gr*0.8,0);GREENS.push({type:'rect',cx,cz:cz+R0*0.25,hw:gr,hd:gr*0.8,c:1,s:0});
  const edge=[];for(let a=0;a<6.28;a+=0.35)edge.push([cx+Math.cos(a)*gr*0.9,cz+R0*0.25+Math.sin(a)*gr*0.7]);trees(broadleaf,10,edge);

function poleLine(pts,spacing,kind){
  const curve=new THREE.CatmullRomCurve3(pts.map(([x,z])=>new THREE.Vector3(x,0,z)),false,'centripetal');
  const n=Math.max(2,Math.round(curve.getLength()/spacing));const sp=curve.getSpacedPoints(n);
  const spec={hv:{h:15,arm:6,wires:[-2.5,0,2.5],twin:true,r:0.24},mv:{h:10.5,arm:2.8,wires:[-1.1,0,1.1],r:0.18}}[kind];
  const tops=[];
  sp.forEach((p,i)=>{
    const a=sp[Math.max(0,i-1)],b=sp[Math.min(n,i+1)];let tx=b.x-a.x,tz=b.z-a.z;const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
    const px=tz,pz=-tx,g=H(p.x,p.z);
    if(spec.twin)for(const s of [-2.2,2.2])poles.push({x:p.x+px*s,z:p.z+pz*s,y:g-0.5,h:spec.h+0.5,r:spec.r});
    else poles.push({x:p.x,z:p.z,y:g-0.5,h:spec.h+0.5,r:spec.r});
    count.poles++;arms.push({x:p.x,z:p.z,y:g+spec.h-0.35,len:spec.arm,rot:Math.atan2(-pz,px)});tops.push({x:p.x,z:p.z,g,px,pz});
  });
  for(let i=1;i<tops.length;i++){const A=tops[i-1],B=tops[i];const sag=Math.hypot(B.x-A.x,B.z-A.z)*0.02;
    for(const o of spec.wires){let prev=null;for(let s=0;s<=8;s++){const t=s/8;
      const x=A.x+A.px*o+(B.x+B.px*o-A.x-A.px*o)*t,z=A.z+A.pz*o+(B.z+B.pz*o-A.z-A.pz*o)*t,y=(A.g+spec.h)+(B.g-A.g)*t-sag*4*t*(1-t);
      if(prev)wirePts.push(prev[0],prev[1],prev[2],x,y,z);prev=[x,y,z];}}}
  return {tops,h:spec.h};
}

const FC=140;
function field(x,z){
  const ix=Math.floor(x/FC),iz=Math.floor(z/FC);let d1=1e9,d2=1e9,id=0;
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=ix+i,b=iz+j;const sx=(a+0.12+hash2(a,b)*0.76)*FC,sz=(b+0.12+hash2(b+31,a-17)*0.76)*FC;
    const d=Math.hypot(x-sx,(z-sz)*1.15);if(d<d1){d2=d1;d1=d;id=a*7919+b;}else if(d<d2)d2=d;}
  return {edge:d2-d1,id};
}

  return {e,dir:new THREE.Vector3(Math.cos(e)*Math.sin(A),Math.max(Math.sin(e),0.03),-Math.cos(e)*Math.cos(A)).normalize(),rise:noon-h0,set:noon+h0};

/* ---------- road names ---------- */
const ROADNAMES=[['main','Main Street',0.45],['quay','Quay Street',0.3],['coast','Lower Road',0.22],['fisher','Fisher Street',0.55],['barrack','Barrack Street',0.5],['church','Church Hill',0.45],['pearse','Pearse Road',0.3],['headland','Scilly Road',0.6],['bypass','Relief Road',0.55]];

/* ---------- UI ---------- */
const zonesEl=document.getElementById('zones');zonesEl.classList.remove('zone-list');
for(const g of ['Overview','Town','Homes','Work','Energy']){
  const lab=document.createElement('div');lab.className='group-label';lab.textContent=g;zonesEl.appendChild(lab);
  const row=document.createElement('div');row.className='zone-list';zonesEl.appendChild(row);
  for(const z of ZONES.filter(z=>z.group===g)){const b=document.createElement('button');b.className='zbtn';b.type='button';b.textContent=z.name;b.dataset.zone=z.id;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>select(z.id));row.appendChild(b);}
}
const labelsEl=document.getElementById('labels');
const tags=ZONES.filter(z=>z.x!==undefined).map(z=>{const b=document.createElement('button');b.className='tag';b.type='button';b.textContent=z.name;b.addEventListener('click',()=>select(z.id));labelsEl.appendChild(b);return {z,el:b,p:new THREE.Vector3(z.x,H(z.x,z.z)+z.lift,z.z)};});
const roadTags=ROADNAMES.map(([n,label,f])=>{const P=roads[n];const m=pathAt(P,P.len*f);const el=document.createElement('span');el.className='road';el.textContent=label;labelsEl.appendChild(el);return {el,p:new THREE.Vector3(m.x,H(m.x,m.z)+2,m.z)};});
const statList=[[units,'Dwellings'],[count.pv,'Rooftop PV'],[count.hp,'Heat pumps'],[count.ev,'Home chargers'],[count.turbines,'Turbines'],[count.poles,'Poles'],[count.txPole+count.txGround+1,'Transformers']];
const statHTML=statList.map(([v,l])=>`<div class="stat"><b>${v.toLocaleString('en-IE')}</b><span>${l}</span></div>`).join('');
document.getElementById('stats').innerHTML=statHTML;document.getElementById('statsInline').innerHTML=statHTML;
const legend=document.getElementById('legend');
function updateLegend(){const parts=[];if(gridLayer.visible)parts.push('<span><i style="background:var(--buoy)"></i>MV feeders and transformers</span><span><i style="background:#f4bd7a"></i>LV cables</span>');
  if(assetLayer.visible)parts.push('<span><i style="background:var(--pv)"></i>PV</span><span><i style="background:var(--hp)"></i>Heat pump</span><span><i style="background:var(--ev)"></i>EV charger</span>');legend.innerHTML=parts.join('');}
document.getElementById('tLabels').addEventListener('change',e=>{labelsEl.hidden=!e.target.checked;});
document.getElementById('tGrid').addEventListener('change',e=>{gridLayer.visible=e.target.checked;M.wire.color.set(e.target.checked?'#f08a2b':'#2b2b2b');M.wire.opacity=e.target.checked?1:0.75;updateLegend();});
document.getElementById('tAssets').addEventListener('change',e=>{assetLayer.visible=e.target.checked;updateLegend();});
const timeEl=document.getElementById('time'),monthEl=document.getElementById('month');
timeEl.addEventListener('input',()=>{ENV.t=parseFloat(timeEl.value);applyEnv();});
monthEl.addEventListener('input',()=>{ENV.month=parseInt(monthEl.value,10);if(ENV.wx==='snow'&&ENV.month>=4&&ENV.month<=10)setWeather('cloudy');else applyEnv();});
const wxEl=document.getElementById('wx');
for(const [k,w] of Object.entries(WX)){const b=document.createElement('button');b.type='button';b.className='zbtn wxbtn';b.dataset.wx=k;b.textContent=w.label;b.addEventListener('click',()=>setWeather(k));wxEl.appendChild(b);}
let playing=false;const playBtn=document.getElementById('play');
playBtn.addEventListener('click',()=>{playing=!playing;playBtn.textContent=playing?'Pause':'Play';playBtn.setAttribute('aria-pressed',String(playing));});
// a random moment, with Irish weather that suits the month
const WXODDS={winter:{sunny:2,cloudy:4,windy:2,rain:4,storm:2,snow:1,fog:1},spring:{sunny:3,cloudy:4,windy:2,rain:3,storm:0.5,snow:0.2,fog:1},summer:{sunny:6,cloudy:3,windy:1,rain:2,storm:0.2,snow:0,fog:0.6},autumn:{sunny:2,cloudy:4,windy:2,rain:4,storm:1.5,snow:0,fog:1.2}};
function randomMoment(){
  ENV.month=1+Math.floor(Math.random()*12);ENV.t=Math.round(Math.random()*24*4)/4;
  const season=[12,1,2].includes(ENV.month)?'winter':ENV.month<=5?'spring':ENV.month<=8?'summer':'autumn';
  const o=WXODDS[season];let r=Math.random()*Object.values(o).reduce((a,b)=>a+b,0);let k='cloudy';for(const [kk,v] of Object.entries(o)){r-=v;if(r<=0){k=kk;break;}}
  timeEl.value=ENV.t;monthEl.value=ENV.month;setWeather(k);
}
document.getElementById('random').addEventListener('click',randomMoment);
const panel=document.getElementById('panel'),menuBtn=document.getElementById('menuBtn'),card=document.getElementById('card');
if(isSmall)panel.classList.add('closed');
menuBtn.addEventListener('click',()=>{const open=panel.classList.toggle('closed')===false;menuBtn.setAttribute('aria-expanded',String(open));card.classList.toggle('panel-open',open);});
document.getElementById('cardClose').addEventListener('click',()=>{card.hidden=true;setPressed(null);});
let fly=null;
function setPressed(id){document.querySelectorAll('.zbtn[data-zone]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.zone===id)));tags.forEach(t=>t.el.classList.toggle('on',t.z.id===id));}
function select(id){
  const z=ZONES.find(q=>q.id===id);if(!z)return;setPressed(id);
  const t=new THREE.Vector3(...z.view.t),o=new THREE.Vector3(...z.view.o);const p=t.clone().add(o);
  if(reduceMotion){controls.target.copy(t);camera.position.copy(p);}else fly={t0:performance.now(),dur:1700,fromT:controls.target.clone(),toT:t,fromP:camera.position.clone(),toP:p};
  if(z.text){document.getElementById('cardGa').textContent=z.ga||'';document.getElementById('cardTitle').textContent=z.name;document.getElementById('cardText').textContent=z.text;
    document.getElementById('cardFacts').innerHTML=(z.facts||[]).map(f=>`<li>${f}</li>`).join('');card.hidden=false;
    if(isSmall){panel.classList.add('closed');menuBtn.setAttribute('aria-expanded','false');card.classList.remove('panel-open');}}
  else card.hidden=true;
}

/* ---------- loop ---------- */
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  if(w>=760)camera.setViewOffset(w,h,-Math.min(170,w*0.12),0,w,h);else camera.clearViewOffset();camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
const ov=ZONES[0].view;controls.target.set(...ov.t);camera.position.set(ov.t[0]+ov.o[0],ov.t[1]+ov.o[1],ov.t[2]+ov.o[2]);
if(isSmall){controls.target.set(-60,10,40);camera.position.set(-60+ov.o[0]*1.25,10+ov.o[1]*1.25,40+ov.o[2]*1.25);}
timeEl.value=ENV.t;monthEl.value=ENV.month;setWeather(ENV.wx);setPressed('overview');
const needle=document.getElementById('needle');
const clock=new THREE.Clock();const v3=new THREE.Vector3();
let turbineSpin=0,flashT=0,nextFlash=3;
function frame(){
  const dt=Math.min(clock.getDelta(),0.1),T=clock.elapsedTime;const W=WX[ENV.wx];
  if(fly){const k=Math.min(1,(performance.now()-fly.t0)/fly.dur);const e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;controls.target.lerpVectors(fly.fromT,fly.toT,e);camera.position.lerpVectors(fly.fromP,fly.toP,e);if(k>=1)fly=null;}
  if(playing){ENV.t=(ENV.t+dt*0.8)%24;timeEl.value=ENV.t;applyEnv();}
  controls.update();
  // lightning in a storm
  if(W.lightning&&!reduceMotion){nextFlash-=dt;if(nextFlash<=0){flashT=0.18;nextFlash=rand(2,7);}}
  if(flashT>0){flashT-=dt;ENV.lightning=flashT>0.1||flashT<0.05?0.9:0.2;applyEnv();if(flashT<=0){ENV.lightning=0;applyEnv();}}
  // turbines follow the wind, and stop above cut-out
  const target=turbineSpeed(ENV.wind);turbineSpin+=(target-turbineSpin)*Math.min(1,dt*0.6);
  if(!reduceMotion)for(const r of turbines)r.rotation.z+=dt*turbineSpin;
  const sea=1+ENV.wind/8;
  for(const b of boats){b.grp.position.y=Math.sin(T*1.2*Math.min(2,sea)+b.ph)*b.amp*sea;if(b.grp.isGroup)b.grp.rotation.z=Math.sin(T*0.9+b.ph)*0.03*sea;}
  const out=boatsOut();
  sailing.forEach((s,i)=>{s.grp.visible=i<out;if(!s.grp.visible)return;if(!reduceMotion)s.th+=s.sp*dt*(0.6+ENV.wind/10);
    const x=s.cx+Math.cos(s.th)*s.rx,z=s.cz+Math.sin(s.th)*s.rz;const tx=-Math.sin(s.th)*s.rx*Math.sign(s.sp),tz=Math.cos(s.th)*s.rz*Math.sign(s.sp);
    s.grp.position.set(x,Math.sin(T*1.4+s.ph)*0.2*sea,z);s.grp.rotation.set(0,Math.atan2(tx,tz),Math.sin(T+s.ph)*0.05+0.12);});
  // traffic signals: a 16 s cycle
  const cyc=T%16;const A=cyc<6?'g':cyc<8?'a':'r';const B=cyc<8?'r':cyc<14?'g':'a';
  sig.ra.color.set(A==='r'?'#ff3b2f':'#2a1313');sig.aa.color.set(A==='a'?'#ffb22e':'#2a2413');sig.ga.color.set(A==='g'?'#3dff7a':'#132a1b');
  sig.rb.color.set(B==='r'?'#ff3b2f':'#2a1313');sig.ab.color.set(B==='a'?'#ffb22e':'#2a2413');sig.gb.color.set(B==='g'?'#3dff7a':'#132a1b');
  M.red.color.set((nightF>0.4||W.fog>0.5)&&Math.floor(T*1.2)%2===0?'#ff2a1a':'#401010');
  // traffic: heavier at rush hour, in summer and in December
  const active=Math.round(movers.length*trafficLevel());mvBody.count=active;mvCab.count=active;
  const slow=ENV.wx==='snow'?0.45:ENV.wx==='storm'||ENV.wx==='fog'?0.7:1;
  for(let i=0;i<active;i++){const m=movers[i];
    if(!reduceMotion){m.u+=m.v*dt*m.dir*slow;if(m.u>1)m.u-=1;if(m.u<0)m.u+=1;}
    const c=roads[m.r].curve;c.getPointAt(m.u,tmpP);c.getTangentAt(m.u,tmpT);
    const tx=tmpT.x*m.dir,tz=tmpT.z*m.dir;const x=tmpP.x+tz*2,z=tmpP.z-tx*2;
    dummy.position.set(x,Math.max(H(x,z),3.3)+0.35,z);dummy.rotation.set(0,Math.atan2(tx,tz),0);dummy.scale.set(1,1,1);dummy.updateMatrix();mvBody.setMatrixAt(i,dummy.matrix);mvCab.setMatrixAt(i,dummy.matrix);}
  mvBody.instanceMatrix.needsUpdate=true;mvCab.instanceMatrix.needsUpdate=true;
  // clouds drift on the wind (from the south-west)
  const drift=ENV.wind*dt*3;const shown=Math.round(CLOUDS*Math.min(1,W.cloud*1.1));let ci=0;
  for(let i=0;i<cloudData.length;i++){const p=cloudData[i];if(p.c>=shown)continue;
    if(p.ox===cloudData[p.c*PUFF].ox){}
    p.cx+=drift*0.7;p.cz-=drift*0.7;if(p.cx>3200)p.cx-=6400;if(p.cz<-3400)p.cz+=5400;
    const dark=ENV.wx==='storm'?0.65:1;dummy.position.set(p.cx+p.ox,p.cy+p.oy-(W.cloud>0.85?140:0),p.cz+p.oz);dummy.rotation.set(0,0,0);dummy.scale.set(p.s,p.s*0.55*dark,p.s);dummy.updateMatrix();cloudMesh.setMatrixAt(ci++,dummy.matrix);}
  cloudMesh.count=ci;cloudMesh.instanceMatrix.needsUpdate=true;
  // rain and snow fall around the camera
  const ctr=v3.copy(camera.position).lerp(controls.target,0.3);
  if(rain.visible){const n=Math.round(RAIN_N*W.rain),fall=(T*(ENV.wx==='storm'?0.9:0.6))%1,wx=ENV.wind*0.04;
    for(let i=0;i<RAIN_N;i++){const o=i*6;if(i>=n){rainPos[o+1]=rainPos[o+4]=-1e4;continue;}
      const fy=((rainSeed[i*3+1]-fall*3)%1+1)%1;const x=ctr.x+(rainSeed[i*3]-0.5)*700,z=ctr.z+(rainSeed[i*3+2]-0.5)*700,y=ctr.y-260+fy*520;
      rainPos[o]=x;rainPos[o+1]=y;rainPos[o+2]=z;rainPos[o+3]=x+wx*6;rainPos[o+4]=y+7;rainPos[o+5]=z-wx*6;}
    rainGeo.attributes.position.needsUpdate=true;}
  if(snow.visible){const fall=(T*0.05)%1;
    for(let i=0;i<SNOW_N;i++){const fy=((rainSeed[i*3+1]-fall)%1+1)%1;snowPos[i*3]=ctr.x+(rainSeed[i*3]-0.5)*600+Math.sin(T+i)*3;snowPos[i*3+1]=ctr.y-220+fy*440;snowPos[i*3+2]=ctr.z+(rainSeed[i*3+2]-0.5)*600+Math.cos(T*0.7+i)*3;}
    snowGeo.attributes.position.needsUpdate=true;}
  // shadows follow what you are looking at
  sun.target.position.copy(controls.target);sun.position.copy(controls.target).addScaledVector(sunDir,2200);sun.target.updateMatrixWorld();
  const dist=camera.position.distanceTo(controls.target);const ext=Math.min(1400,Math.max(260,dist*0.75));
  if(Math.abs(sc.right-ext)>20){sc.left=-ext;sc.right=ext;sc.top=ext;sc.bottom=-ext;sc.updateProjectionMatrix();}
  // labels
  if(!labelsEl.hidden){const w=window.innerWidth,h=window.innerHeight;
    for(const t of tags){v3.copy(t.p).project(camera);const vis=v3.z<1&&Math.abs(v3.x)<1.1&&Math.abs(v3.y)<1.1;if(!vis){t.el.style.display='none';continue;}t.el.style.display='';
      t.el.style.transform=`translate(${(v3.x*0.5+0.5)*w}px,${(-v3.y*0.5+0.5)*h}px) translate(-50%,-100%) translateY(-12px)`;}
    for(const t of roadTags){v3.copy(t.p).project(camera);const vis=v3.z<1&&Math.abs(v3.x)<1&&Math.abs(v3.y)<1&&dist<1300;if(!vis){t.el.style.display='none';continue;}t.el.style.display='';
      t.el.style.transform=`translate(${(v3.x*0.5+0.5)*w}px,${(-v3.y*0.5+0.5)*h}px) translate(-50%,-50%)`;}}
  const fx=controls.target.x-camera.position.x,fz=controls.target.z-camera.position.z;needle.style.transform=`rotate(${-Math.atan2(fx,-fz)}rad)`;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
document.getElementById('loading').remove();
requestAnimationFrame(frame);
window.__bn={count,units};
</script>
