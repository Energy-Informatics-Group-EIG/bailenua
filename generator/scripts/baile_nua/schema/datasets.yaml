      (7.1) and the frozen G-B willingness specification (5.14 firewall).
    fields:
      - {name: target_id, type: string, required: true}
      - {name: statistic, type: string, required: true}
      - {name: domain, type: string, required: true, notes: "population | activity | appliance | physics | weather | mimic"}
      - {name: value, type: float, required: false}
      - {name: value_json, type: json, required: false, notes: "for vector or table targets"}
      - {name: unit, type: string, required: true}
      - {name: tolerance, type: float, required: true}
      - {name: tolerance_kind, type: string, required: true, notes: "absolute | relative | sampling-error-band"}
      - {name: source_file, type: string, required: true, notes: "path under sources/"}
      - {name: source_sha256, type: string, required: true}
      - {name: source_url, type: string, required: true}
      - {name: source_licence, type: string, required: true}
      - {name: retrieved_at, type: date, required: true}
      - {name: intended_use, type: string, required: true, notes: "7.1 source-use register: calibration | validation | reference"}
      - {name: model_development_exposure, type: string, required: true, notes: "7.1: did it influence design, model selection or tuning?"}
      - {name: evidence_tag, type: string, required: true, notes: "[C] | [P] | [A] | [U]"}
      - {name: provisional, type: bool, required: true, notes: "E0-4 / U11: section 7 margins are provisional"}

  # ---------------------------------------------------------------- D25 ------
  D25:
    name: mimic_export
    title: HRSD participants, profiles, MCV, sessions and responses in MIMIC schema 1.1
    access_class: OBS
    access_note: "OBS on the MIMIC side: this is what MIMIC legitimately holds about a participant."
    grain: participant, session, response
    storage: "MIMIC MySQL via the public API; Parquet copy"
    subsystem: S04
    e1_in_scope: true
    mimic_schema_version: "1.1"
    forbidden_field_patterns:
      # 5.14 level 2: forbidden fields are never exported. A negative-test batch
      # deliberately sends them and ProfileService must reject them.
      - "(?i)health"
      - "(?i)fitness"
      - "(?i)mobility"
      - "(?i)medical"
      - "(?i)country_of_birth"
      - "(?i)diagnos"
      - "(?i)disabil"
    fields:
      - {name: participant_id, type: string, required: true, mimic_field: "participants.id", mechanism: "the UUID MIMIC issues when consent is granted"}
      - {name: consent_version, type: string, required: true, mimic_field: "profiles.consent_version", mechanism: "the consent text version the participant agreed to", notes: "SYNTHETIC-HRSD-v1-<pool>; MIMIC's LIKE 'SYNTHETIC%' purge and banner work unchanged (U17)"}
      - {name: consent_granted_at, type: timestamp, required: true, mimic_field: "profiles.consent_granted_at", mechanism: "the server clock when consent was recorded"}
      - {name: mcv_position, type: enum, enum: mcv_position, required: true, mimic_field: "profiles.mcv_position", mechanism: "MIMIC's own randomisation of where the MCV block falls"}
      - {name: age_band, type: string, required: true, mimic_field: "profiles.age_band", mechanism: "the band the participant selected", notes: "MIMIC bands use an en-dash; see I-003"}
      - {name: reported_sex, type: string, required: true, mimic_field: "profiles.sex", mechanism: "the participant's selection", notes: "self-reported. Named distinctly from D05.sex (GT, persistent layer) so the two cannot be joined; MIMIC's own column name is preserved in mimic_field."}
      - {name: household_size, type: string, required: true, mimic_field: "profiles.household_size", mechanism: "the participant's own count of people in the home"}
      - {name: children_present, type: string, required: true, mimic_field: "profiles.children_present", mechanism: "the participant's answer about anyone under 18"}
      - {name: employment_status, type: string, required: true, mimic_field: "profiles.employment_status", mechanism: "the participant's selection", notes: "U18 gap: MIMIC has no 'Home duties' value"}
      - {name: reported_work_pattern, type: string, required: true, mimic_field: "profiles.work_pattern", mechanism: "the participant's selection", notes: "self-reported. Named distinctly from D08.work_pattern (GT, evolving layer)."}
      - {name: reported_dwelling_type, type: string, required: true, mimic_field: "profiles.dwelling_type", mechanism: "the participant's selection", notes: "self-reported, named distinctly from D02.dwelling_type (GT). U18 gap: MIMIC has no 'Terraced' value, a common Cobh house type."}
      - {name: ownership_status, type: string, required: true, mimic_field: "profiles.ownership_status", mechanism: "the participant's selection"}
      - {name: region_country, type: string, required: true, mimic_field: "profiles.region_country", mechanism: "the participant's selection"}
      - {name: region_nuts3, type: string, required: true, mimic_field: "profiles.region_nuts3", mechanism: "the participant's selection"}
      - {name: urban_rural_island, type: string, required: true, mimic_field: "profiles.urban_rural_island", mechanism: "the participant's selection"}
      - {name: income_band, type: string, required: true, mimic_field: "profiles.income_band", mechanism: "the participant's selection"}
      - {name: der_ownership, type: json, required: true, mimic_field: "profiles.der_ownership", mechanism: "the participant's recollection of what is installed"}
      - {name: environmental_concern, type: int, required: true, mimic_field: "profiles.environmental_concern", mechanism: "the participant's self-report on a 1 to 5 scale", notes: "round(3 + 1.05 * latent), clamped 1 to 5, as MIMIC"}
      - {name: trust_in_automation, type: int, required: true, mimic_field: "profiles.trust_in_automation", mechanism: "the participant's self-report"}
      - {name: comfort_sensitivity, type: int, required: true, mimic_field: "profiles.comfort_sensitivity", mechanism: "the participant's self-report"}
      - {name: mcv_01_to_10, type: "list[int]", required: true, mimic_field: "profile_mcv.mcv_01..10", mechanism: "the participant's Likert answers to the 10 Moral and Community Values items"}
      - {name: profile_optional, type: json, required: false, mimic_field: "profile_optional.*", mechanism: "the ten optional FlexSense Table 3 items the participant chose to answer", notes: "design 5.14: the 10 permitted fields. e.g. home_automation_level <- sensor tier; energy_bill_responsibility <- decision authority. ADR-004 exclusions already applied by MIMIC."}
      - {name: session_id, type: string, required: false, mimic_field: "sessions.id", mechanism: "the session MIMIC created"}
      - {name: chosen_signal, type: enum, enum: mimic_signal, required: false, mimic_field: "responses.chosen_signal", mechanism: "the option the participant chose"}
      - {name: chosen_display_position, type: int, required: false, mimic_field: "responses.chosen_display_position", mechanism: "where that option happened to appear on screen"}
      - {name: display_permutation, type: json, required: false, mimic_field: "responses.display_permutation", mechanism: "MIMIC's own option-order randomisation for that item"}
      - {name: latency_ms, type: int, required: false, mimic_field: "responses.latency_ms", mechanism: "wall time between the item being shown and answered"}
      - {name: is_probe, type: bool, required: false, mimic_field: "responses.is_probe", mechanism: "MIMIC's own item flag"}
      - {name: is_probe_repeat, type: bool, required: false, mimic_field: "responses.is_probe_repeat", mechanism: "MIMIC's own item flag"}

  # ---------------------------------------------------------------- D26 ------
  D26:
    name: mimic_answer_key
    title: Crosswalk to person_id, true traits, planted segments, propensity, gap, test settings
    access_class: GT
    access_note: "Scoring only. Never written into MIMIC (5.14 level 2)."
    grain: participant
    storage: parquet
    e1_in_scope: true
    fields:
      - {name: participant_id, type: string, required: true}
      - {name: person_id, type: string, required: true}
      - {name: pool, type: enum, enum: mimic_pool, required: true}
      - {name: true_traits, type: json, required: true, notes: "the ten MIMIC latents as generated"}
      - {name: planted_segment, type: string, required: false, notes: "T3: the k segments planted, or null in null mode"}
      - {name: planted_null_mode, type: bool, required: true, notes: "T3(b): no clusters planted"}
      - {name: response_propensity, type: float, required: true}
      - {name: stated_gap, type: float, required: true}
      - {name: satisficer, type: bool, required: true}
      - {name: planted_position_bias, type: float, required: true, notes: "T10: 0 in the clean batch, non-zero in the planted batch"}
      - {name: planted_context_effect, type: json, required: false, notes: "T7 AMCE"}
      - {name: generator, type: string, required: true, notes: "5.14 independence protocol: G-A | G-B | G-C"}
      - {name: gc_mode, type: string, required: false, notes: "wrong assumptions | non-identifiable | continuous no clusters | causally unrelated | differential non-response"}
      - {name: simulated_session_date, type: date, required: false, notes: "U19: the API timestamps are run-time, the simulated date is carried here"}
      - {name: test_mode_settings, type: json, required: true}

  # ---------------------------------------------------------------- D27 ------
  D27:
    name: tariffs_contracts
    title: Supplier tariff, ToU and export rates, switches, flexibility and P2P terms, connection limits
    access_class: OBS
    access_note: "What a utility or aggregator would hold. Market rules live in META."
    grain: home x interval
    storage: parquet
    e1_in_scope: true
    keyed_by: premises
    fields:
      - {name: premises_id, type: string, required: true, mechanism: "the meter point on the supply contract"}
      - {name: valid_from, type: timestamp, required: true, mechanism: "the contract start the supplier recorded"}
      - {name: valid_to, type: timestamp, required: false, mechanism: "the contract end the supplier recorded"}
      - {name: supplier, type: string, required: true, mechanism: "the supplier of record"}
      - {name: tariff_code, type: string, required: true, mechanism: "the tariff the account is on"}
      - {name: tariff_kind, type: string, required: true, mechanism: "as published by the supplier", notes: "flat | day-night | ToU | U10: existing retail tariffs only in the base model"}
      - {name: rate_schedule, type: json, required: true, mechanism: "the published rate card"}
      - {name: standing_charge_eur_day, type: float, required: true, mechanism: "the published standing charge"}
      - {name: export_rate_eur_kwh, type: float, required: false, mechanism: "the published clean-export guarantee rate"}
      - {name: max_import_kw, type: float, required: true, mechanism: "the connection capacity on the network operator's record"}
      - {name: max_export_kw, type: float, required: true, mechanism: "the export capacity notified to and accepted by the network operator"}
      - {name: der_notification_ref, type: string, required: false, mechanism: "the DER notification reference the operator issued"}
      - {name: flex_contract_terms, type: json, required: false, mechanism: "the aggregator contract terms on file"}
      - {name: trial_arm, type: string, required: false, mechanism: "the arm this premises was randomised to at recruitment (6.4 item 5)"}

  # ---------------------------------------------------------------- D28 ------
  D28:
    name: study_protocol
    title: Recruitment, response rates, consent to sensors, dropouts, trial arms and periods
    access_class: OBS
    access_note: "The true selection mechanism stays in GT (6.4 item 1)."
    grain: premises x event
    storage: parquet + protocol document
    e1_in_scope: true
    keyed_by: premises
    fields:
      - {name: premises_id, type: string, required: true, mechanism: "the premises the study recorded against"}
      - {name: protocol_event, type: string, required: true, mechanism: "the study team's own log entry", notes: "invited | responded | declined | consented | installed | withdrew | dropped_out | randomised"}
      - {name: recorded_at, type: timestamp, required: true, mechanism: "when the study team entered the record, which may lag the event"}
      - {name: recruitment_route, type: string, required: true, mechanism: "how the household was approached"}
      - {name: consent_sensors, type: string, required: false, mechanism: "the consent form the household signed", notes: "6.5 rule 3: consent records are sometimes incomplete"}
      - {name: tier_consented, type: enum, enum: sensor_tier, required: false, mechanism: "the sensor package the household agreed to"}
      - {name: install_delay_days, type: int, required: false, mechanism: "the gap between consent and the installer attending"}
      - {name: trial_arm, type: string, required: false, mechanism: "the arm the randomisation list assigned"}
      - {name: arm_deviation, type: string, required: false, mechanism: "the study team's note of non-compliance or crossover"}
      - {name: withdrawal_reason, type: string, required: false, mechanism: "the reason the household gave, where they gave one"}

  # ---------------------------------------------------------------- D29 ------
  D29:
    name: household_survey
    title: Questionnaire answers with calibrated reporting error and non-response
    access_class: OBS
    access_note: "True values stay in GT. The too-good test (6.5 rule 1) bounds agreement."
    grain: premises x wave
    storage: parquet
    e1_in_scope: true
    keyed_by: premises
    fields:
      - {name: premises_id, type: string, required: true, mechanism: "the premises the questionnaire was sent to"}
      - {name: wave, type: int, required: true, mechanism: "the survey wave the study ran"}
      - {name: responded_at, type: timestamp, required: false, mechanism: "when the respondent submitted; null for unit non-response"}
      - {name: q_household_size, type: int, required: false, mechanism: "the respondent's own count of people in the home", gt_counterpart: "D06.membership count"}
      - {name: q_children_under_18, type: int, required: false, mechanism: "the respondent's answer", gt_counterpart: "D06 membership under 18"}
      - {name: q_occupied_weekday_hours, type: float, required: false, mechanism: "the respondent's estimate of hours someone is usually home", gt_counterpart: "D11 presence hours", notes: "optimistic occupancy is a calibrated bias (6.5 rule 3)"}
      - {name: q_dwelling_type, type: string, required: false, mechanism: "the respondent's answer", gt_counterpart: "D02.dwelling_type"}
      - {name: q_heating_system, type: string, required: false, mechanism: "the respondent's answer, which may be out of date", gt_counterpart: "D02.heating_system"}
      - {name: q_has_pv, type: string, required: false, mechanism: "the respondent's recollection", gt_counterpart: "D04 pv asset present"}
      - {name: q_has_ev, type: string, required: false, mechanism: "the respondent's recollection", gt_counterpart: "D04 vehicle asset is EV"}
      - {name: q_appliances, type: json, required: false, mechanism: "the respondent ticking a list, with omissions", gt_counterpart: "D04 appliance stock"}
      - {name: q_env_behaviour_score, type: int, required: false, mechanism: "the respondent's self-report, subject to social-desirability bias", notes: "over-reported by design (6.5 rule 3)"}
      - {name: q_comfort_preference_c, type: float, required: false, mechanism: "the respondent's stated preferred temperature"}
      - {name: straightlined, type: bool, required: true, mechanism: "derived by the survey platform from answer variance, as a real platform would flag it"}
      - {name: item_nonresponse_count, type: int, required: true, mechanism: "count of items the respondent left blank"}

  # ---------------------------------------------------------------- D30 ------
  D30:
    name: recorded_metadata
    title: Recorded building and asset data, stale or wrong at realistic rates
    access_class: OBS
    access_note: "True values are in D02/D04."
    grain: premises x version
    storage: parquet
    e1_in_scope: true
    keyed_by: premises
    fields:
      - {name: premises_id, type: string, required: true, mechanism: "the premises the record is filed against"}
      - {name: record_version, type: int, required: true, mechanism: "the version of the administrative record"}
      - {name: recorded_at, type: timestamp, required: true, mechanism: "when the assessor or installer filed it"}
      - {name: record_source, type: string, required: true, mechanism: "who filed it", notes: "BER assessor | installer | operator | self-declared"}
      - {name: rec_ber_band, type: string, required: false, mechanism: "the band on the published BER certificate, which predates any later retrofit", gt_counterpart: "D02.ber_band"}
      - {name: rec_ber_kwh_m2_yr, type: float, required: false, mechanism: "the figure on the certificate", gt_counterpart: "D02.ber_kwh_m2_yr"}
      - {name: rec_floor_area_m2, type: float, required: false, mechanism: "the area the assessor measured or transcribed", gt_counterpart: "D02.floor_area_m2", notes: "subject to m2/ft2 unit errors (6.5 rule 3)"}
      - {name: rec_dwelling_type, type: string, required: false, mechanism: "the assessor's classification", gt_counterpart: "D02.dwelling_type"}
      - {name: rec_build_year, type: int, required: false, mechanism: "the year on the record", gt_counterpart: "D02.build_year"}
      - {name: rec_heating_system, type: string, required: false, mechanism: "the system recorded at assessment", gt_counterpart: "D02.heating_system"}
      - {name: rec_pv_kwp, type: float, required: false, mechanism: "the size on the installer's notification", gt_counterpart: "D04.capacity for pv", notes: "subject to kW/kWp confusion"}
      - {name: rec_pv_install_date, type: date, required: false, mechanism: "the date on the notification", gt_counterpart: "D04.install_date"}
      - {name: rec_pv_azimuth_deg, type: float, required: false, mechanism: "the orientation the installer recorded, at release-level coarseness", gt_counterpart: "D04.pv_azimuth_deg"}
      - {name: rec_shading, type: string, required: false, mechanism: "the installer's shading note"}
      - {name: record_conflict, type: string, required: false, mechanism: "a note where two sources disagree (assessor against installer)"}
      - {name: asset_since_removed, type: bool, required: true, mechanism: "true where the record still lists an asset that has since gone, because nobody told the register"}

  # ---------------------------------------------------------------- D31 ------
  D31:
    name: external_series
    title: Station weather, wholesale prices, carbon intensity, system demand, flex events
    access_class: OBS
    grain: series-native
    storage: parquet
    e1_in_scope: true
    fields:
      - {name: series_id, type: string, required: true, mechanism: "the publisher's own series identifier"}
      - {name: ts, type: timestamp, required: true, mechanism: "the publisher's timestamp, on the publisher's interval convention"}
      - {name: value, type: float, required: false, mechanism: "the published value; null during a station outage or publication gap", gt_counterpart: "D15 for weather series"}
      - {name: unit, type: string, required: true, mechanism: "as published"}
      - {name: station_or_zone, type: string, required: true, mechanism: "the measuring station or market zone", notes: "6.4 item 7: the nearest official station, not the true site microclimate"}
      - {name: quality, type: enum, enum: quality_flag, required: true, mechanism: "the publisher's quality flag, including gap-filled values"}
      - {name: provenance, type: enum, enum: provenance_code, required: true, mechanism: "measured, estimated or interpolated, as the publisher states"}
      - {name: revision, type: int, required: true, mechanism: "the publication revision; prices and demand are revised after the fact"}
      - {name: realisation_id, type: string, required: true, mechanism: "the weather realisation this series is consistent with (6.5 rule 2: one realisation drives everything)"}
      - {name: segment, type: string, required: true, mechanism: "recorded in the evidence view only, so it does not become a tell", notes: "real historical | generated projection (6.5 rule 2)"}
