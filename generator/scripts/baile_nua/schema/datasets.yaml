# =============================================================================
# Baile Nua / HRSD_Occupants — dataset schema
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH (design 8.5, decision D-005).
# It generates, and is never generated from:
#   * row validators                      -> baile_nua.schema.validate
#   * the access-class allow-lists        -> baile_nua.schema.access
#   * the GT/OBS leakage test             -> tests/test_leakage.py
#   * the data dictionary in the evidence view
#
# access_class  GT   ground truth, never given to a model under test
#               OBS  observable, what a device, respondent, assessor or
#                    operator would see
#               META provenance and calibration
#
# layer         The four-layer person state model (design 5.1).  Any field whose
#               layer is persistent / evolving / stochastic is GT by definition;
#               only `observation` may appear in an OBS dataset.
#
# mechanism     REQUIRED on every field of an OBS dataset (design 6.5 rule 1):
#               the real-world process that would produce the value.  A field
#               with no such mechanism is rejected at schema level, by
#               test_schema_obs_fields_declare_a_mechanism.
#
# gt_counterpart  For an OBS field that observes a GT field: "D02.floor_area_m2".
#               Drives the 6.5 "too-good" test — agreement with the counterpart
#               must not exceed the calibrated error model's upper bound.
# =============================================================================

schema_version: "1.0.0"
design_revision: 3
design_frozen: "2026-10-08"
label: "UNVALIDATED SIMULATION EVIDENCE: E1 engineering candidate"

units:
  energy: Wh
  power: W
  temperature: degC
  relative_humidity: percent
  co2: ppm
  distance: km
  time: "UTC timestamptz; Europe/Dublin views are derived"

id_prefixes:
  person: "P-"
  household: "H-"
  building: "B-"
  asset: "A-"
  venue: "V-"
  premises: "MPRN-"   # opaque, observable; keyed to the property, not the household

access_classes:
  GT:
    description: Ground truth. Never given to a model under test.
    released_in: ground_truth
  OBS:
    description: Observable. What a device, respondent, assessor or operator would see.
    released_in: observable
  META:
    description: Provenance and calibration.
    released_in: evidence

# -----------------------------------------------------------------------------
# Enumerations, declared once and referenced by fields.
# -----------------------------------------------------------------------------
enums:
  sex: [F, M]
  household_role: [head, partner, child, parent, lodger, other]
  econ_status:
    [employed, self-employed, unemployed, student, retired, home duties, unable to work]
  work_pattern: [fixed day, shift, part-time, irregular, none]
  health_state: [well, short illness, reduced mobility, home-bound, recovering]
  caring_load: [none, child, elderly, both]
  vehicle_access: [none, shared, own]
  zone: [living, kitchen, bedroom, bathroom, utility, hall, outside, in_transit, out_of_model]
  activity_trigger: [routine, joint plan, event, signal, disruption, lapse]
  life_event_type:
    [birth, death, move in, move out, partnering, separation, job change,
     retirement, health change, retrofit decision, DER decision, extension]
  event_class: [predictable, recurring, irregular, exceptional]
  event_phase: [preparation, main, recovery, rebound]
  event_footprint: [home, street, estate, town, region]
  change_class: [safety, equipment, routine deviation, structural]
  persistence: [transient, persistent, permanent]
  quality_flag: [ok, estimated, missing, suspect, drift, fault]
  provenance_code: [metered, estimated, interpolated, operator-recorded, respondent-reported, modelled]
  sensor_tier: [T1, T2, T3, T4]
  fidelity_tier: [F1, F2, F3]
  coupling_mode: [C1, C2, C3]
  device_mode: [rendered, live]
  tenure: [owner-occupied with mortgage, owner-occupied no mortgage, rented private, rented social, rent free]
  dwelling_type: [detached, semi-detached, terraced, apartment, bedsit]
  heating_fuel: [electricity, natural gas, oil, solid fuel, LPG, heat pump, district]
  ber_band: [A1, A2, A3, B1, B2, B3, C1, C2, C3, D1, D2, E1, E2, F, G]
  mimic_signal: [SO, RC, CP, AL]
  mimic_pool: [BN-panel, HRSD-pool]
  mcv_position: [pre, post]
  scale_down_method: [whole_area_stratified, proportional]
  # BN-1 / D17_aggregate: which of the operator's three LV records a row is.
  network_record_kind: [connection_register, feeder_head, substation]

# =============================================================================
# DATASETS D01 - D31  (design 6.1)
# =============================================================================
datasets:

  # ---------------------------------------------------------------- D01 ------
  D01:
    name: town_geo
    title: Parcels, streets, venues, network topology
    access_class: GT
    grain: feature
    storage: geoparquet
    subsystem: S02
    e1_in_scope: true          # minimal: one estate, its street, its feeder
    fields:
      - {name: feature_id, type: string, required: true, notes: "V- for venues, else synthetic key"}
      - {name: feature_kind, type: string, required: true, notes: "parcel | street | venue | feeder | transformer | farm"}
      - {name: geometry_wkt, type: string, required: true}
      - {name: venue_type, type: string, required: false, notes: "school, shop, pub, church, GAA club, workplace"}
      - {name: capacity, type: int, required: false, notes: "design 5.4: every venue has a capacity"}
      - {name: feeder_id, type: string, required: false}
      - {name: estate_id, type: string, required: false}
      - {name: valid_from, type: timestamp, required: true}
      - {name: valid_to, type: timestamp, required: false}

  # ---------------------------------------------------------------- D02 ------
  D02:
    name: buildings
    title: "HRSD_Buildings: fabric, archetype, BER, systems, physics parameters"
    access_class: GT
    grain: building x version
    storage: parquet
    subsystem: S03
    e1_in_scope: true
    fields:
      - {name: building_id, type: string, required: true, id_prefix: "B-"}
      - {name: version, type: int, required: true, notes: "bumped by a D03 passport event"}
      - {name: valid_from, type: timestamp, required: true}
      - {name: valid_to, type: timestamp, required: false}
      - {name: premises_id, type: string, required: true, notes: "GT side of the opaque observable key"}
      - {name: estate_id, type: string, required: true}
      - {name: dwelling_type, type: enum, enum: dwelling_type, required: true}
      - {name: build_year, type: int, required: true}
      - {name: floor_area_m2, type: float, required: true}
      - {name: storeys, type: int, required: true}
      - {name: archetype_id, type: string, required: true}
      - {name: ber_band, type: enum, enum: ber_band, required: true, notes: "asset rating; operation may diverge (5.7 performance gap)"}
      - {name: ber_kwh_m2_yr, type: float, required: true}
      - {name: heating_fuel, type: enum, enum: heating_fuel, required: true}
      - {name: heating_system, type: string, required: true}
      - {name: heating_control, type: string, required: true, notes: "timer | thermostat | TRV | manual"}
      - {name: tenure, type: enum, enum: tenure, required: true}
      - {name: sri_class, type: string, required: false, notes: "ISO 52120-1 building automation class"}
      - {name: sri_score, type: float, required: false}
      # -- F1 two-zone grey-box RC parameters (design 5.7) --
      - {name: rc_r_ie, type: float, required: true, unit: K/W, notes: "indoor-envelope resistance"}
      - {name: rc_r_ea, type: float, required: true, unit: K/W, notes: "envelope-ambient resistance"}
      - {name: rc_r_zz, type: float, required: true, unit: K/W, notes: "living-sleeping inter-zone resistance"}
      - {name: rc_r_inf, type: float, required: true, unit: K/W, notes: "infiltration path"}
      - {name: rc_c_living, type: float, required: true, unit: J/K}
      - {name: rc_c_sleep, type: float, required: true, unit: J/K}
      - {name: rc_c_env, type: float, required: true, unit: J/K}
      - {name: rc_solar_aperture_m2, type: float, required: true}
      - {name: rc_vol_living_m3, type: float, required: true}
      - {name: rc_vol_sleep_m3, type: float, required: true}
      - {name: ach_base, type: float, required: true, unit: "1/h", notes: "background infiltration"}
      - {name: heat_emitter_w, type: float, required: true, notes: "maximum deliverable heat"}
      - {name: dhw_tank_litres, type: float, required: false}
      - {name: fidelity_tier, type: enum, enum: fidelity_tier, required: true}
      - {name: seed, type: int, required: true}

  # ---------------------------------------------------------------- D03 ------
  D03:
    name: building_passport
    title: Dated building events (extension, retrofit, asset added or removed)
    access_class: GT
    obs_view: D03_redacted
    grain: event
    storage: parquet
    subsystem: S03
    e1_in_scope: true
    fields:
      - {name: passport_event_id, type: string, required: true}
      - {name: building_id, type: string, required: true}
      - {name: event_type, type: string, required: true}
      - {name: effective_at, type: timestamp, required: true}
      - {name: decided_at, type: timestamp, required: false}
      - {name: from_version, type: int, required: true}
      - {name: to_version, type: int, required: true}
      - {name: parameters_changed, type: json, required: true}
      - {name: driver, type: string, required: true, notes: "the model and reason that fired it"}
      - {name: life_event_id, type: string, required: false}

  # ---------------------------------------------------------------- D04 ------
  D04:
    name: assets
    title: Appliances, heating, PV, BESS, chargers, vehicles, with owner and lifetime
    access_class: GT
    grain: asset x version
    storage: parquet
    subsystem: S03
    e1_in_scope: true
    fields:
      - {name: asset_id, type: string, required: true, id_prefix: "A-"}
      - {name: version, type: int, required: true}
      - {name: valid_from, type: timestamp, required: true}
      - {name: valid_to, type: timestamp, required: false}
      - {name: building_id, type: string, required: false}
      - {name: owner_person_id, type: string, required: false, notes: "vehicles and personal devices"}
      - {name: asset_class, type: string, required: true, notes: "appliance | heating | pv | bess | charger | vehicle"}
      - {name: asset_type, type: string, required: true, notes: "kettle, washer, heat_pump, immersion, ..."}
      - {name: make_model_synth, type: string, required: true, notes: "synthetic model label, drives signature variation"}
      - {name: rated_power_w, type: float, required: false}
      - {name: capacity, type: float, required: false, unit: "Wh for BESS, kWp for PV, litres for tanks"}
      - {name: efficiency, type: float, required: false}
      - {name: install_date, type: date, required: true}
      - {name: age_years_at_t0, type: float, required: true}
      - {name: failure_hazard_scale, type: float, required: true, notes: "Weibull scale, drives 5.3 appliance failure"}
      - {name: signature_id, type: string, required: false, notes: "-> D22"}
      - {name: device_mode, type: enum, enum: device_mode, required: true, notes: "5.6 rendered vs live"}
      - {name: pv_azimuth_deg, type: float, required: false}
      - {name: pv_tilt_deg, type: float, required: false}
      - {name: seed, type: int, required: true}

  # ---------------------------------------------------------------- D05 ------
  D05:
    name: persons
    title: "HRSD_Occupants: persistent characteristics and trait vector"
    access_class: GT
    grain: person
    storage: parquet
    subsystem: S04
    e1_in_scope: true
    fields:
      - {name: person_id, type: string, required: true, id_prefix: "P-", layer: persistent}
      - {name: given_name, type: string, required: true, layer: persistent, notes: "synthetic, uniqueness-checked"}
      - {name: family_name, type: string, required: true, layer: persistent}
      - {name: birth_date, type: date, required: true, layer: persistent}
      - {name: death_date, type: date, required: false, layer: evolving, notes: "set by D09"}
      - {name: sex, type: enum, enum: sex, required: true, layer: persistent}
      - {name: country_of_birth, type: string, required: true, layer: persistent, notes: "ISO 3166-1 alpha-2"}
      - {name: nationality, type: string, required: true, layer: persistent, notes: "ISO 3166-1 alpha-2"}
      - {name: ethnicity_census, type: string, required: true, layer: persistent, notes: "CSO category; synthesis and stereotype-guard only"}
      - {name: first_language, type: string, required: true, layer: persistent, notes: "ISO 639-1"}
      - {name: other_languages, type: "list[string]", required: false, layer: persistent}
      - {name: years_in_ireland, type: float, required: false, layer: evolving, notes: "drives idvZ acculturation shrinkage (5.13)"}
      - {name: education_level, type: string, required: true, layer: evolving, notes: "ISCED; evolves via D08 while in education"}
      # -- MIMIC latent traits: same names and scales as mimic_sd_generator.php (5.14 level 1) --
      - {name: trans, type: float, required: true, unit: z-score, layer: persistent, mimic_trait: true}
      - {name: community, type: float, required: true, unit: z-score, layer: persistent, mimic_trait: true}
      - {name: env, type: float, required: true, unit: z-score, layer: persistent, mimic_trait: true}
      - {name: autonomy, type: float, required: true, unit: z-score, layer: persistent, mimic_trait: true}
      - {name: comfort, type: float, required: true, unit: z-score, layer: persistent, mimic_trait: true}
      - {name: conditional, type: float, required: true, unit: z-score, layer: persistent, mimic_trait: true}
      - {name: privacy, type: float, required: true, unit: z-score, layer: persistent, mimic_trait: true}
      - {name: instTrust, type: float, required: true, unit: z-score, layer: persistent, mimic_trait: true}
      - {name: idvZ, type: float, required: true, unit: z-score, layer: persistent, mimic_trait: true, notes: "cultural individualism from origin country, shrunk by acculturation"}
      - {name: satisficer, type: int, required: true, enum_values: [0, 1], layer: persistent, mimic_trait: true, notes: "careless-responder flag"}
      - {name: stated_gap, type: float, required: true, unit: "0 to 1", layer: persistent, notes: "stated vs revealed willingness (5.13)"}
      - {name: lambda_self, type: float, required: true, layer: persistent, notes: "lambda_1; the three sum to 1"}
      - {name: lambda_coop, type: float, required: true, layer: persistent, notes: "lambda_2"}
      - {name: lambda_altru, type: float, required: true, layer: persistent, notes: "lambda_3"}
      - {name: big5_o, type: float, required: true, unit: z-score, layer: persistent}
      - {name: big5_c, type: float, required: true, unit: z-score, layer: persistent}
      - {name: big5_e, type: float, required: true, unit: z-score, layer: persistent}
      - {name: big5_a, type: float, required: true, unit: z-score, layer: persistent}
      - {name: big5_n, type: float, required: true, unit: z-score, layer: persistent}
      - {name: chronotype, type: float, required: true, unit: hours, layer: persistent, notes: "shifts the sleep window"}
      - {name: habit_strength, type: float, required: true, unit: "0 to 1", layer: persistent}
      - {name: lapse_rate, type: float, required: true, unit: "0 to 1", layer: persistent}
      - {name: attention, type: float, required: true, unit: "0 to 1", layer: persistent}
      - {name: response_propensity, type: float, required: true, unit: "0 to 1", layer: persistent, notes: "5.14 MIMIC opt-in propensity"}
      - {name: mcv_latent, type: "list[float]", required: true, layer: persistent, notes: "10 MCV item latents, MIMIC makeMcv mapping"}
      - {name: synthetic, type: bool, required: true, notes: "R27/K12: every record carries the synthetic flag"}
      - {name: seed, type: int, required: true, layer: persistent}
      - {name: pool, type: enum, enum: mimic_pool, required: false, notes: "BN-panel for simulated townspeople; HRSD-pool for the unlinked extended pool"}

  # ---------------------------------------------------------------- D06 ------
  D06:
    name: household_membership
    title: Who lives where, from when to when
    access_class: GT
    grain: interval
    storage: parquet
    subsystem: S04
    e1_in_scope: true
    fields:
      - {name: membership_id, type: string, required: true}
      - {name: person_id, type: string, required: true}
      - {name: household_id, type: string, required: true, id_prefix: "H-"}
      - {name: building_id, type: string, required: true}
      - {name: valid_from, type: timestamp, required: true}
      - {name: valid_to, type: timestamp, required: false}
      - {name: role, type: enum, enum: household_role, required: true}
      - {name: reason_in, type: string, required: false, notes: "t0 | birth | move in | partnering | returning"}
      - {name: reason_out, type: string, required: false}

  # ---------------------------------------------------------------- D07 ------
  D07:
    name: relationships
    title: Kin, partner, carer, friend, co-worker edges
    access_class: GT
    grain: edge x interval
    storage: parquet
    subsystem: S04
    e1_in_scope: true
    fields:
      - {name: edge_id, type: string, required: true}
      - {name: person_a, type: string, required: true}
      - {name: person_b, type: string, required: true}
      - {name: edge_type, type: string, required: true, notes: "partner | parent_of | sibling | carer_of | friend | co_worker | neighbour"}
      - {name: valid_from, type: timestamp, required: true}
      - {name: valid_to, type: timestamp, required: false}
      - {name: strength, type: float, required: false, unit: "0 to 1", notes: "drives 5.3 influence"}

  # ---------------------------------------------------------------- D08 ------
  D08:
    name: person_states
    title: Evolving states, slowly changing (SCD-2)
    access_class: GT
    grain: interval
    storage: parquet
    subsystem: S05
    e1_in_scope: true
    fields:
      - {name: state_id, type: string, required: true}
      - {name: person_id, type: string, required: true, layer: evolving}
      - {name: valid_from, type: timestamp, required: true}
      - {name: valid_to, type: timestamp, required: false}
      - {name: household_id, type: string, required: true, layer: evolving}
      - {name: role, type: enum, enum: household_role, required: true, layer: evolving}
      - {name: econ_status, type: enum, enum: econ_status, required: true, layer: evolving}
      - {name: occupation_soc, type: string, required: false, layer: evolving, notes: "SOC 2010"}
      - {name: occupation_isco08, type: string, required: false, layer: evolving, notes: "mapped for MIMIC compatibility (5.13)"}
      - {name: industry_nace, type: string, required: false, layer: evolving, notes: "NACE rev2"}
      - {name: workplace_venue_id, type: string, required: false, layer: evolving}
      - {name: work_pattern, type: enum, enum: work_pattern, required: true, layer: evolving}
      - {name: remote_share, type: float, required: true, unit: "0 to 1 of working days", layer: evolving}
      - {name: school_venue_id, type: string, required: false, layer: evolving}
      - {name: school_year, type: int, required: false, layer: evolving}
      - {name: health_state, type: enum, enum: health_state, required: true, layer: evolving, notes: "U09: generic functional states only, never diagnoses"}
      - {name: caring_load, type: enum, enum: caring_load, required: true, layer: evolving}
      - {name: caring_hours_week, type: float, required: true, layer: evolving}
      - {name: decision_authority, type: float, required: true, unit: "0 to 1 within household", layer: evolving}
      - {name: vehicle_access, type: enum, enum: vehicle_access, required: true, layer: evolving}
      - {name: income_quintile, type: int, required: true, enum_values: [1, 2, 3, 4, 5], layer: evolving}

  # ---------------------------------------------------------------- D09 ------
  D09:
    name: life_events
    title: Births, deaths, moves, jobs, health states, decisions
    access_class: GT
    grain: event
    storage: parquet
    subsystem: S05
    e1_in_scope: true
    fields:
      - {name: event_id, type: string, required: true}
      - {name: event_type, type: enum, enum: life_event_type, required: true}
      - {name: effective_at, type: timestamp, required: true}
      - {name: decided_at, type: timestamp, required: false, notes: "lead time for decisions with one"}
      - {name: persons, type: "list[string]", required: true}
      - {name: household_id, type: string, required: false}
      - {name: building_id, type: string, required: false}
      - {name: cause, type: string, required: true, notes: "the model and driver that fired"}
      - {name: observable_effects, type: json, required: true, notes: "expected signal changes, for D20"}

  # ---------------------------------------------------------------- D10 ------
  D10:
    name: activities
    title: Person activity intervals with location and co-participants
    access_class: GT
    grain: interval
    storage: parquet
    partition_by: [year, month]
    subsystem: S07
    e1_in_scope: true
    calibration_status: "VERIFIED, NOT CALIBRATED (E0-2 / U04)"
    fields:
      - {name: activity_id, type: string, required: true}
      - {name: person_id, type: string, required: true, layer: stochastic}
      - {name: start, type: timestamp, required: true, layer: stochastic, notes: "1 s precision"}
      - {name: end, type: timestamp, required: true, layer: stochastic}
      - {name: activity_code, type: string, required: true, layer: stochastic, notes: "~30 codes, mapped to HETUS"}
      - {name: hetus_code, type: string, required: true, notes: "the HETUS aggregate this maps to"}
      # SCHEMA CORRECTION, flagged for audit (I-090). Was `required: true`,
      # which no activity interval can satisfy: an `in_transit` interval is
      # on the road network and has no place id, and 14% of the estate's
      # intervals are in_transit. D11.location_id is the SAME quantity,
      # resolved by the same engine code, and is already `required: false`.
      # The alternatives were to invent a place for a travelling person or
      # to leave D10 unwritable; neither is acceptable.
      - {name: location_id, type: string, required: false, layer: stochastic}
      - {name: zone, type: enum, enum: zone, required: true, layer: stochastic}
      - {name: joint_with, type: "list[string]", required: false, layer: stochastic}
      - {name: trigger, type: enum, enum: activity_trigger, required: true, layer: stochastic}
      - {name: deliberated, type: bool, required: true, layer: stochastic, notes: "true if a decision process ran (5.3 bounded rationality)"}

  # ---------------------------------------------------------------- D11 ------
  D11:
    name: presence
    title: Person location intervals - the no-double-occupancy source
    access_class: GT
    grain: interval
    storage: parquet
    partition_by: [year, month]
    subsystem: S07
    e1_in_scope: true
    fields:
      - {name: presence_id, type: string, required: true}
      - {name: person_id, type: string, required: true, layer: stochastic}
      - {name: start, type: timestamp, required: true, layer: stochastic}
      - {name: end, type: timestamp, required: true, layer: stochastic}
      - {name: location_kind, type: string, required: true, notes: "building | venue | in_transit | out_of_model"}
      - {name: location_id, type: string, required: false}
      - {name: zone, type: enum, enum: zone, required: true}

  # ---------------------------------------------------------------- D12 ------
  D12:
    name: trips
    title: Origin, destination, mode, vehicle, distance
    access_class: GT
    grain: event
    storage: parquet
    subsystem: S08
    e1_in_scope: true
    fields:
      - {name: trip_id, type: string, required: true}
      - {name: person_id, type: string, required: true}
      - {name: start, type: timestamp, required: true}
      - {name: end, type: timestamp, required: true}
      - {name: origin_id, type: string, required: true}
      - {name: destination_id, type: string, required: true}
      - {name: mode, type: string, required: true, notes: "car | ev | walk | cycle | bus | rail | passenger"}
      - {name: vehicle_asset_id, type: string, required: false}
      - {name: distance_km, type: float, required: true}
      - {name: purpose, type: string, required: true}

  # ---------------------------------------------------------------- D13 ------
  D13:
    name: appliance_cycles
    title: Cycle start/end, programme, signature ID, energy
    access_class: GT
    grain: event
    storage: parquet
    partition_by: [year, month]
    subsystem: S10
    e1_in_scope: true
    fields:
      - {name: cycle_id, type: string, required: true}
      - {name: asset_id, type: string, required: true}
      - {name: building_id, type: string, required: true}
      - {name: start, type: timestamp, required: true, notes: "1 s precision"}
      - {name: end, type: timestamp, required: true}
      - {name: programme, type: string, required: true, notes: "eco 40, kettle 1.5 L, ..."}
      - {name: signature_id, type: string, required: true}
      - {name: signature_seed, type: int, required: true, notes: "drives 1 Hz rendering"}
      - {name: energy_wh, type: float, required: true}
      - {name: peak_w, type: float, required: true}
      - {name: caused_by_activity_id, type: string, required: false, notes: "causal link back to D10"}
      - {name: flexible, type: bool, required: true}
