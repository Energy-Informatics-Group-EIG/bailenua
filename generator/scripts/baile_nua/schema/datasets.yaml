      - {name: coupling_mode, type: enum, enum: coupling_mode, required: true}
      - {name: epoch_staleness_s, type: int, required: true, notes: "8.2 timing contract: the staleness stamp on the published state"}

  # ------------------------------------------------------- D17_aggregate ----
  # BN-1. D17's declared observable view, and design 6.3's "aggregate D17
  # view".  What a DSO actually holds about its LV network, and only that:
  #
  #   * the CONNECTION REGISTER - which MPRN sits on which feeder and which
  #     substation;
  #   * the asset register's RATINGS - transformer nameplate kVA and feeder
  #     cable thermal rating.  Both are catalogue values of the pandapower
  #     standard types the network is built from, so neither is declared
  #     here (network/lv.py: STD_TRAFO, STD_CABLE);
  #   * the feeder-head and substation MEASUREMENTS - active and reactive
  #     power at the operator's metering point.
  #
  # What it deliberately does NOT carry:
  #
  # voltage
  #     lv.assert_voltage_is_not_a_claim() always raises.  The LV topology is
  #     [A] (A-49) and voltage drop is a line integral along exactly the
  #     declared feeder span, so a per-unit voltage is a property of the
  #     assumption as much as of the town.  Publishing it as a DSO
  #     measurement would present an assumption as an observation.
  # loading_pct
  #     per-element loading is GT and stays GT.  The ratings and the
  #     measurements are both here because BN-1 names them; their RATIO is
  #     not published.
  # per-connection power
  #     the register names a premises; no per-MPRN power appears, which is
  #     what keeps an aggregate view aggregate.
  D17_aggregate:
    name: network_state_aggregate
    title: "D17's observable view: connection register, asset ratings, feeder-head and substation measurements"
    access_class: OBS
    grain: "one row per premises in the register; one row per (epoch, element) for a measurement"
    storage: parquet
    subsystem: S11
    e1_in_scope: true
    keyed_by: premises
    notes: >
      A measurement here is the solved epoch power at the operator's metering
      point.  E1 renders no instrument error for network metering - D18 is the
      only dataset with a device error model - so a value equals the quantity
      D17 records for the same element and epoch.  That is stated rather than
      hidden, and it is why no gt_counterpart is declared: there is no
      calibrated error model for this instrument for the 6.5 too-good test to
      bound agreement against.
    fields:
      - {name: record_kind, type: enum, enum: network_record_kind, required: true, mechanism: "which of the operator's three LV records this row is: a connection-register entry, a feeder-head measurement, or a substation measurement"}
      - {name: ts, type: timestamp, required: true, mechanism: "the timestamp the operator's system stamps on the record: the metering timestamp of a measurement, or the as-at instant of the connection register"}
      - {name: premises_id, type: string, required: false, mechanism: "the MPRN as it appears in the operator's connection register; null on a measurement row, which names a network element and not a customer"}
      - {name: substation_ref, type: string, required: true, mechanism: "the distribution substation's reference in the operator's asset register; every LV connection and every LV circuit is recorded against exactly one"}
      - {name: feeder_ref, type: string, required: false, mechanism: "the LV circuit's reference in the operator's asset register; null on a substation measurement, which sits upstream of every circuit"}
      - {name: transformer_rated_kva, type: float, unit: kVA, required: false, mechanism: "the distribution transformer's nameplate rating, read off the operator's asset register; null where the row's subject is not a transformer"}
      - {name: feeder_rated_a, type: float, unit: A, required: false, mechanism: "the feeder cable's thermal current rating, from the cable type recorded in the operator's asset register; null where the row's subject is not a circuit"}
      - {name: p_kw_measured, type: float, unit: kW, required: false, mechanism: "the active power the feeder-pillar or substation CT metering reports for the epoch, positive for import; null on a register row, which carries no measurement"}
      - {name: q_kvar_measured, type: float, unit: kvar, required: false, mechanism: "the reactive power the same CT metering reports for the epoch; null on a register row"}

  # ---------------------------------------------------------------- D18 ------
  # First OBS dataset: every field must declare `mechanism` (design 6.5 rule 1).
  D18:
    name: observations
    title: Rendered device readings with noise and gaps
    access_class: OBS
    grain: device-native
    storage: "rendered on demand; cached slices"
    subsystem: S12
    e1_in_scope: true
    keyed_by: premises
    fields:
      - {name: device_id, type: string, required: true, mechanism: "the device's own identifier as the data-collection platform records it"}
      - {name: premises_id, type: string, required: true, mechanism: "the meter point the device is registered against (6.4 item 2: keyed by premises, not household)"}
      - {name: channel, type: string, required: true, mechanism: "the channel label configured on the device at installation", notes: "import_w, export_w, ct_ev, temp_living, co2_living, pir_hall, ..."}
      - {name: ts, type: timestamp, required: true, mechanism: "the device clock at the moment of sampling, including its drift"}
      - {name: value, type: float, required: false, mechanism: "the device's quantised reading; null where the reading never arrived", gt_counterpart: "D16/D13/D17 true quantity"}
      - {name: quality, type: enum, enum: quality_flag, required: true, mechanism: "the collection platform's own quality assessment of the reading"}
      - {name: tier, type: enum, enum: sensor_tier, required: true, mechanism: "the sensor package consented to and installed at this premises"}
      - {name: provenance, type: enum, enum: provenance_code, required: true, mechanism: "how the platform obtained the value: metered, estimated, interpolated"}
      - {name: unit, type: string, required: true, mechanism: "the unit configured for the channel"}

  # ---------------------------------------------------------------- D19 ------
  D19:
    name: edge_exports
    title: "What leaves each home: aggregates, energy profile, flexibility compliance"
    access_class: OBS
    grain: 15/30 min
    storage: parquet
    subsystem: S13
    e1_in_scope: true
    keyed_by: premises
    forbidden_field_patterns:
      # R09 / E0-8. The leakage test refuses any field matching these, by name,
      # whatever its contents.  There is no occupancy field, ever.
      - "(?i)occupan"
      - "(?i)presence"
      - "(?i)person"
      - "(?i)household"
      - "(?i)resident"
      - "(?i)people"
      - "(?i)n_adults?"
      - "(?i)n_children"
      - "(?i)activity"
      - "(?i)asleep|awake|at_home|away"
      - "(?i)trait|willing|comfort_band"
    fields:
      - {name: premises_id, type: string, required: true, mechanism: "the meter point the edge device is commissioned against"}
      - {name: interval_start, type: timestamp, required: true, mechanism: "the export interval boundary agreed in the data contract"}
      - {name: interval_end, type: timestamp, required: true, mechanism: "as above"}
      # I-067/I-076. required: FALSE, and the reason is a conflict the schema
      # could not previously express. Design 7.8 offers `compliance_only` as a
      # MITIGATION in which "only flexibility compliance leaves the home", and
      # a schema that requires the four energy fields on every row makes that
      # configuration impossible to represent. That is why `include_profile`
      # only ever gated the summary string: gating the energy would have
      # violated the contract, so the mitigation silently carried the full
      # series instead and had home_30min's inference risk.
      #
      # They are required for every OTHER configuration, which is a
      # CONDITIONAL requirement the flat schema cannot state. The condition
      # is enforced by test_export_configurations_differ.py, so nothing is
      # weakened: a profile-carrying export with a null energy field still
      # fails, and only compliance_only may omit it.
      - {name: import_wh, type: float, required: false, mechanism: "the edge device's integration of metered import over the interval", notes: "conditionally required: present for every export configuration that carries a profile, absent for compliance_only (I-067). Enforced by test, not by this flag."}
      - {name: export_wh, type: float, required: false, mechanism: "the edge device's integration of metered export over the interval", notes: "conditionally required; see import_wh"}
      - {name: interval_peak_w, type: float, required: false, mechanism: "maximum sampled demand within the interval, as the edge device computes it", notes: "named distinctly from D13.peak_w, which is a per-cycle peak: the two must never be joined. Conditionally required; see import_wh"}
      - {name: interval_min_w, type: float, required: false, mechanism: "minimum sampled demand within the interval", notes: "conditionally required; see import_wh"}
      - {name: building_energy_profile, type: json, required: false, mechanism: "the building energy profile the edge device publishes under the data contract (R09)"}
      - {name: flex_event_id, type: string, required: false, mechanism: "the identifier of the flexibility request the home was asked to serve"}
      - {name: flex_compliance_pct, type: float, required: false, mechanism: "the edge device's own assessment of delivery against the request"}
      - {name: export_config, type: string, required: true, mechanism: "the export configuration in force (7.8: home 30 min, home 15 min, estate aggregate, compliance only)"}
      - {name: quality, type: enum, enum: quality_flag, required: true, mechanism: "the edge device's quality assessment of the interval"}

